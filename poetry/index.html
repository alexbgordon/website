  src: `
On l'atzur mediterrani
~en Where the Mediterranean azure
~fr Où l'azur méditerranéen
~es Donde el azur mediterráneo
abraça el robust [[Montjuïc|1]];
~en embraces robust Montjuïc;
~fr embrasse le robuste Montjuïc ;
~es abraza el robusto Montjuïc;
i entre els dos: [[dracs i roses|2]],
~en and between the two: dragons and roses,
~fr et entre les deux : dragons et roses,
~es y entre los dos: dragones y rosas,
Barcelona, tu enlluernes.
~en Barcelona, you dazzle.
~fr Barcelone, tu éblouis.
~es Barcelona, tú deslumbras.

L'aire embriaga dolçament,
~en The air intoxicates sweetly,
~fr L'air enivre doucement,
~es El aire embriaga dulcemente,
i la calor de l'[[or vermell|3]],
~en and the heat of the red gold,
~fr et la chaleur de l'or vermeil,
~es y el calor del oro rojo,
palpable pels carrers.
~en palpable through the streets.
~fr palpable dans les rues.
~es palpable por las calles.

Que bonic, divagar pel parc
~en How lovely, to drift through the park
~fr Que c'est beau, divaguer dans le parc
~es Qué bonito, divagar por el parque
de la [[salamandra|4]],
~en of the salamander,
~fr de la salamandre,
~es de la salamandra,

*on és normal [[dir-se Alexandre|5]].*
~en *where it is normal to be called Alexandre.*
~fr *où il est normal de s'appeler Alexandre.*
~es *donde es normal llamarse Alexandre.*
` },

{ id: 'andromeda', title: 'ΑΝΔΡΟΜΕΔΑ', roma: 'Andromeda', langs: ['English', 'Greek', 'Latin', 'Amharic'], codes: 'EN · GRC · LA · AM', dir: 'ltr', script: true, lang: "en", epiLang: "la", trTitle: { en: "Andromeda" },
  notes: {"1": {"en": "“Descendant of Abas”: Perseus. Abas was the father of Acrisius, whose daughter Danaë bore Perseus. The epigraph is Ovid, Metamorphoses 4.672–675, where Perseus first sees Andromeda chained to the rock and almost takes her for a marble statue.<span class=\"nsrc\"><a href=\"https://www.thelatinlibrary.com/ovid/ovid.met4.shtml\" target=\"_blank\" rel=\"noopener\">The Latin Library: Ovid, Metamorphoses IV</a> · <a href=\"https://en.wikipedia.org/wiki/Acrisius\" target=\"_blank\" rel=\"noopener\">Wikipedia: Acrisius</a></span>"}, "2": {"en": "Stanzas 2–4 are iambic pentameter in rhymed couplets, the English line “used for six hundred years”.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Heroic_couplet\" target=\"_blank\" rel=\"noopener\">Wikipedia: Heroic couplet</a></span>"}, "3": {"en": "Cassiopeia boasted that she (or her daughter) was more beautiful than the Nereids, so Poseidon sent a sea monster, and Andromeda was chained to the rock to pay for it. In Ovid, Perseus bargains for her as his bride before he fights the monster (Metamorphoses 4.695–705), and her earlier betrothed Phineus later contests the marriage (Metamorphoses 5).<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Andromeda_(mythology)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Andromeda (mythology)</a> · <a href=\"https://www.thelatinlibrary.com/ovid/ovid.met4.shtml\" target=\"_blank\" rel=\"noopener\">The Latin Library: Metamorphoses IV</a></span>"}, "4": {"en": "Medusa's name is the feminine participle of <span lang=\"grc\">μέδω</span>, “to protect, rule over”: guardian, ruler. Andromeda's name is usually explained as “ruler of men” or “mindful of a man”. In the myth Perseus beheads Medusa and then, flying home, rescues Andromeda, so the question sets the two women against each other. The verb <span lang=\"grc\">μεδομένη</span> is bent on purpose: in classical Greek the middle voice means “mindful of”, and the poem turns it toward “ruled by”.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Medusa\" target=\"_blank\" rel=\"noopener\">Wikipedia: Medusa</a> · <a href=\"https://en.wikipedia.org/wiki/Andromeda_(mythology)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Andromeda (mythology)</a> · <a href=\"https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0057:entry=me/dw\" target=\"_blank\" rel=\"noopener\">Perseus Digital Library</a></span>"}, "5": {"en": "<span lang=\"am\">ጩኸት</span>, “scream”, in Amharic. In Greek myth Andromeda's father Cepheus was king of Aethiopia; her scream is written in Amharic, in Ge'ez script, the language of the modern country that took the myth's name. Its second sentence turns on ሲሰበር, “when it breaks”: as obsidian breaks, the speaker grows sharper.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Andromeda_(mythology)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Andromeda (mythology)</a></span>"}, "6": {"en": "In the Leiden conventions used by editors of inscriptions and papyri, double square brackets ⟦ ⟧ mark text deliberately erased in antiquity, and “- - -” marks lost letters of unknown number. Her words were not lost; they were erased.<span class=\"nsrc\"><a href=\"https://papyri.info/docs/leiden_plus\" target=\"_blank\" rel=\"noopener\">papyri.info: Leiden conventions</a></span>"}, "7": {"en": "Obsidian is volcanic glass that breaks into extremely sharp edges, which is why it was used for blades: glass that becomes a weapon when it breaks.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Obsidian\" target=\"_blank\" rel=\"noopener\">Wikipedia: Obsidian</a></span>"}, "8": {"en": "The Andromeda Galaxy (M31) is one of the few galaxies whose light is blueshifted: it is approaching the Milky Way at about 110 km/s. Its central black hole is roughly 100–230 million solar masses; ours, Sagittarius A*, is about 4 million, so “twenty times” is a poetic rounding of a ratio closer to 25–50. The long-standing prediction was that the two galaxies will merge; a 2025 study in Nature Astronomy puts the chance of a merger within 10 billion years at about 50%.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Andromeda_Galaxy\" target=\"_blank\" rel=\"noopener\">Wikipedia: Andromeda Galaxy</a> · <a href=\"https://en.wikipedia.org/wiki/Sagittarius_A*\" target=\"_blank\" rel=\"noopener\">Wikipedia: Sagittarius A*</a> · <a href=\"https://www.nature.com/articles/s41550-025-02563-1\" target=\"_blank\" rel=\"noopener\">Nature Astronomy (2025)</a> · <a href=\"https://science.nasa.gov/missions/hubble/apocalypse-when-hubble-casts-doubt-on-certainty-of-galactic-collision/\" target=\"_blank\" rel=\"noopener\">NASA</a></span>"}, "9": {"en": "Ovid himself (Heroides 15.35–36) calls Andromeda fusca, dark with the colour of her native land, yet European painting almost always shows her pale. The line holds both: the dark at the galaxy's core, and an Ethiopian princess painted white.<span class=\"nsrc\"><a href=\"https://www.greekmythology.com/sources/ovid/heroides/15-sappho-to-phaon\" target=\"_blank\" rel=\"noopener\">Ovid, Heroides 15</a></span>"}},
  inspiration: {"en": "When I started this poem I knew nothing about the Andromeda Galaxy, not even why it has that name. Looking it up sent me down a rabbit hole. The galaxy takes its name from the constellation it sits in, and the constellation takes its name from an Ethiopian princess: in the Greek myth, Andromeda is the daughter of Cepheus, king of Aethiopia, chained to a rock to pay for her mother's boast. Ovid even calls her dark, with the colour of her homeland, but nearly every European painting I found shows her white. The more I read, the more I saw the same pattern in the sky itself. The constellations we use today are Greek and European, fixed by astronomers in the twentieth century, and they were drawn over skies that peoples across Africa had already named and read for thousands of years. Then I found the detail that tied it all together: the stars that proved Andromeda is a whole galaxy, not a nearby cloud, are called Cepheids, after a star in her father's constellation. Even the obsidian in her scream turned out to be, by Pliny's account, an Ethiopian stone. A woman who had been bound, sold and painted over turned out to be bigger than anyone had imagined, and coming toward us. I found that history quite beautiful to write about, and this poem is my attempt to let her speak through what was erased."},
  more: [{"label": "Ovid, Metamorphoses 4–5", "en": "Where I first met her: the myth of Perseus and Andromeda.<span class=\"nsrc\"><a href=\"https://www.thelatinlibrary.com/ovid/ovid.met4.shtml\" target=\"_blank\" rel=\"noopener\">The Latin Library: Metamorphoses IV</a></span>"}, {"label": "Heliodorus, Aethiopica", "en": "A Greek novel (3rd–4th century AD) in which an Ethiopian queen bears a white daughter after gazing at a painting of Andromeda.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Aethiopica\" target=\"_blank\" rel=\"noopener\">Wikipedia: Aethiopica</a></span>"}, {"label": "Pliny the Elder, Natural History 36.196", "en": "On obsidian, named for Obsius, who found it in Aethiopia.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Natural_History_(Pliny)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Natural History (Pliny)</a></span>"}],
  src: `
> *quam simul ad duras religatam bracchia cautes*
~en As soon as Abas's great-grandson saw her,
> *vidit* [[*Abantiades*|1]]*, nisi quod levis aura capillos*
~en her arms bound to the hard rocks (had a light breeze not
> *moverat et tepido manabant lumina fletu,*
~en stirred her hair, and her eyes not streamed with warm tears,
> *marmoreum ratus esset opus;* (Ovid, *Metamorphoses* 4.672–675)
~en he would have taken her for a work of marble) (Ovid, Metamorphoses 4.672–675)

# [[I. SENTENCE|2]]

\t\t\t\t\tThe sea's
\t\t\tmighty ego,
to be assuaged

demanded that the girl be bound and caged.
Beautiful of terror, bound to that stone,
and gilded ropes held fast her wrists, her waist,
yet she it was who held him with her gaze.

A savior sent from heaven, cut her free,
and thought her marble — cold, and carved to be
admired — until the wind disturbed her hair,
a burning tear undid the statue there.

He drew her from the deep; his hands, a yoke,
closed 'round a ring, another chain to choke;
[[her mother's debt|3]], for which with life she'd pay,
priced like a bride, she too was giv'n away.

and carried she was,
\t\t\tfrom monster
\t\t\t\t\tto marriage.

# II. ONOMA
~en II. NAME

Κηφῆος θυγάτηρ,
= Kēphēos thygátēr,
~en Daughter of Cepheus,
Κασσιεπείης ἀνάσσης,
= Kassiepeíēs anássēs,
~en of Queen Cassiopeia,
Νηρηΐδων καλλίων  — ΑΝΔΡΟΜΕΔΑ,
= nērēḯdōn kallíōn — Andromeda,
~en fairer than the Nereids — ANDROMEDA,
ἀλλ᾽ ἦν ἀνδρὸς μεδομένη;
= all' ēn andròs medoménē?
~en but was she one a man held sway over?
ἢ ἀνδρῶν [[**μέδουσα;**|4]]
= ē andrôn médousa?
~en Or the one who held sway over men — a Medusa?

# III. [[ጩኸት|5]]
= č'uhät
~en III. SCREAM

[[⟦ - - - ⟧|6]]
~en ⟦ - - - ⟧ (erased)

«እኔ፡ብርጭቆ፡አይደለሁም። [[ኦብሲዲያን|7]]፡ሲሰበር፡እኔ፡የበለጠ፡ስለታም፡እሆናለሁ።»
= «Ǝne bǝrč'ǝqo aydellehum. Obsidiyan sīsebber, ǝne yebelet'e sǝlet'am ǝhonallehu.»
~en “I'm not glass. As obsidian breaks, the sharper I become.”

# IV. APPROACH

Nearly everything in the universe
is receding—redshifted.
ΑΝΔΡΟΜΕΔΑ is, however, falling
onto us—[[blueshifted|8]]

at a hundred and ten
kilometers a second.

Her core holds a hundred million suns of appetite,
an appetite twenty times the one we keep.
For so long, they feared this dark at her core
and [[painted it      away|9]].

In roughly four billion years,
they say, the galaxies will meet.
She whose fate men once decided
now holds ours.

The bound woman is coming,
and she has grown greater now
than we can fathom.

And I wonder, as I admire from afar,
the celestial vault that dazzles the night,
if she is blazing home, or rather seeks revenge.
` },

{ id: 'plus-ultra', title: 'Plus Ultra', langs: ['Italian', 'Latin'], codes: 'IT · LA', dir: 'ltr', script: false, lang: "it", trTitle: { en: "Further Beyond" },
  notes: {"1": {"en": "My grandmother, whom we call Nana. She loves orchids, and she is also the subject of my poem “Nana”."}, "2": {"en": "Latin capulus: coffin, bier.<span class=\"nsrc\"><a href=\"https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0059:entry=capulus\" target=\"_blank\" rel=\"noopener\">Perseus Digital Library</a></span>"}, "3": {"en": "Dante, Inferno XIV.51. Capaneus, the blasphemer lying unbowed under the rain of fire, says: “As I was alive, so am I dead.” He still defies Jove after death.<span class=\"nsrc\"><a href=\"https://divinacommedia.dante.global/inferno/testo/inf14.htm\" target=\"_blank\" rel=\"noopener\">Dante, Inferno XIV</a> · <a href=\"https://en.wikipedia.org/wiki/Capaneus\" target=\"_blank\" rel=\"noopener\">Wikipedia: Capaneus</a></span>"}, "4": {"en": "The antiphon sung as the body leaves the church at a Latin funeral Mass: “May the angels lead you into paradise.” It is also the last movement of Fauré's Requiem.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/In_paradisum\" target=\"_blank\" rel=\"noopener\">Wikipedia: In paradisum</a> · <a href=\"https://en.wikipedia.org/wiki/Requiem_(Faur%C3%A9)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Requiem (Fauré)</a></span>"}, "5": {"en": "The motto “Dum spiro, spero” turned into “Non spero: spiro,” and in Italian, credo becomes crepo.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Dum_spiro_spero\" target=\"_blank\" rel=\"noopener\">Wikipedia: Dum spiro spero</a></span>"}, "6": {"en": "From the Requiem introit, “et lux perpetua luceat eis.” My poem answers: perpetual, nay rather, but not here, and never yours.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Requiem\" target=\"_blank\" rel=\"noopener\">Wikipedia: Requiem</a></span>"}, "7": {"en": "Saint-Exupéry's The Little Prince: the prince's single rose, which he loves because he has tamed her, and the fox's lesson that “you become responsible forever for what you have tamed”; “piccolo, laggiù… il cappello in mano” may be the prince himself.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/The_Little_Prince\" target=\"_blank\" rel=\"noopener\">Wikipedia: The Little Prince</a></span>"}, "8": {"en": "Recalls “doubting” Thomas, who would not believe in the risen Christ unless he could touch the wounds (John 20:25).<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Thomas_the_Apostle\" target=\"_blank\" rel=\"noopener\">Wikipedia: Thomas the Apostle</a></span>"}, "9": {"en": "Echoes Lucretius, De rerum natura 1.73: Epicurus's mind “went far beyond the flaming walls of the world” (flammantia moenia mundi), defying religion to do it.<span class=\"nsrc\"><a href=\"https://classicalanthology.theclassicslibrary.com/2019/06/16/de-rerum-natura-1-62-79-lucretius-devotion-to-epicurus/\" target=\"_blank\" rel=\"noopener\">Lucretius, De rerum natura 1.62–79</a></span>"}, "10": {"en": "A reference to the third poem, “ΑΝΔΡΟΜΕΔΑ”: the galaxy and the princess."}, "11": {"en": "Latin lucifer, “light-bearer,” the morning star, later the name of the fallen angel. The kiss for both God and Lucifer sits inside the poem's light imagery.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Lucifer\" target=\"_blank\" rel=\"noopener\">Wikipedia: Lucifer</a></span>"}, "12": {"en": "“Nothing further beyond” was said to be inscribed on the Pillars of Hercules at the Strait of Gibraltar, the edge of the known world. Charles V dropped the non and took Plus Ultra, “further beyond”, as his motto; it is still Spain's national motto.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Plus_ultra_(motto)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Plus ultra (motto)</a></span>"}, "13": {"en": "Giordano Bruno, burned in Campo de' Fiori in 1600, gagged at the stake. The Latin I give him is my own paraphrase of his infinite universe.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Giordano_Bruno\" target=\"_blank\" rel=\"noopener\">Wikipedia: Giordano Bruno</a></span>"}},
  inspiration: {"en": "I first ran into “plus ultra” while reading Italian poems. It is the old motto of going past the Pillars of Hercules, past the edge of the known world, and what stayed with me was the sense of rising above: not stopping where you're told the world ends. I first wanted to write a lauda, the old Italian song of praise. But the poem begins at a funeral, and the prayer I kept hearing there was “lux perpetua,” let perpetual light shine on them. So instead of a hymn the poem became an argument with that light, carried past the flaming walls of the world, all the way to Andromeda. My grandmother, whom we call Nana, is in it too. She loves orchids, and she is the one whose hands guide the light through the dark."},
  more: [{"label": "The lauda", "en": "The Italian vernacular hymn of praise: I first wanted to write one, and that is where the poem started.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Lauda_(song)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Lauda (song)</a></span>"}, {"label": "The Requiem Mass", "en": "The Latin Mass for the dead the poem begins at.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Requiem\" target=\"_blank\" rel=\"noopener\">Wikipedia: Requiem</a></span>"}],
  src: `
# I. REQUIEM
~en I. REQUIEM

Mattina d’ottobre,
~en An October morning,
’na cassa di pino, chiaro.
~en a pine box, pale;
quattro maniglie d'ottone,
~en four brass handles,
col chiodo di pena, storto.
~en and the nail of grief, driven in crooked.

ornamento.   in morte
~en ornament.   in death
nessuno guarda
~en no one looks

rose bianche, già stanche,
~en white roses, already weary,
legate con lo spago;
~en tied up with string;
né la cera che cola
~en nor the wax that drips
e s'indurisce sul marmo,
~en and hardens on the marble,

sandalo.   in scandalo
~en sandalwood.   in scandal
nessuno sente
~en no one senses

Un Odore di terra bagnata,
~en A Smell of wet earth,
d'incenso e di catrame,
~en of incense and of tar;
fuori, sull'asfalto
~en outside, on the asphalt,
colombi e due gomme,
~en pigeons, and two tires,

incerti.   in transitu
~en uncertain.   in passing
nessuno riprende
~en no one takes it up again

una catena d'oro
~en a gold chain
sul collo di [[Nana|1]],
~en on Nana's neck,
e le sue mani guidando
~en and her hands guiding
la luce per buio.
~en the light through the dark.

benedicendo.   [[in capulo|2]]
~en blessing.   on the bier
tutti conoscono
~en everyone knows

l'uomo nel legno,
~en the man in the wood,
con la mia faccia,
~en with my face,
le mie mani e paure
~en my hands and my fears
pettinate per bene
~en neatly combed

ornamento.   post mortem
~en ornament.   post mortem
nessuno saprà:
~en no one will know:

mai ci credevo
~en I never believed
quello che dissero.
~en a word of what they said.
[[*Qual io fui vivo,*|3]]
~en What I was alive,
*tal son morto.*
~en such am I dead.

# II. IN PARADISUM
~en II. INTO PARADISE

Ed entra il coro:
~en And the choir comes in:

[[*In paradisum deducant te angeli*|4]] —
~en May the angels lead you into paradise —

e la voce, cristallina,
~en and the voice, crystalline,
scende, e non è suono:
~en descends, and is not sound:

E l'armonia angelica,
~en And the angelic harmony,
l'aria organometallica,
~en the organ-metal air,
mi passa per caput
~en passes through my head:
ignis est deorum.
~en it is the fire of the gods.

[[Non spero: spiro.|5]]
~en I do not hope: I breathe.
Non ci credo: ne crepo.
~en I do not believe: I burst.
La mia hybris implode
~en My hubris implodes
in mille trilli santi,
~en into a thousand holy trills,

e dall'implosione
~en and from the implosion
la spinta prendo.
~en I take my thrust.

[[*Lux perpetua*|6]]
~en Light perpetual

*Perpetua*, immo:
~en Perpetual, nay rather:
Sed non hic:
~en But not here:
Nōn vestra:
~en Not yours:
Nunquam vestra erat
~en It was never yours

# III. CONGEDO I
~en III. ENVOI I

Dunque vado.
~en So I go.

Addio alla creta,
~en Farewell to the clay,
al fango ed alla radice,
~en to the mud and to the root,
al pane, al vino,
~en to the bread, to the wine,
alla ruggine sui cancelli.
~en to the rust on the gates.

Addio alla cera
~en Farewell to the wax
che si scioglie
~en that melts away
per illuminare un santo
~en to light up a saint
di gesso.
~en made of plaster.

Addio alle cose
~en Farewell to the things
che finiscono.
~en that come to an end.

Una rosa mi mira
~en A rose gazes at me
e per un momento resto.
~en and for a moment I stay.
[[La rosa del principe|7]],
~en The prince's rose,
l'unica, la mia,
~en the only one, mine,
quella che avevo addomesticato.
~en the one I had tamed.

Resto.
~en I stay.

E poi vado lo stesso.
~en And then I go all the same.

Addio pur a lui,
~en Farewell to him as well,
piccolo, laggiù,
~en small, down there,
che tiene ancora il cappello in mano
~en still holding his hat in his hand,
e non sa alzare la testa.
~en unable to lift his head.

# IV. CONGEDO II
~en IV. ENVOI II

Dunque prendo volo.
~en So I take flight.

La nuvola si apre
~en The cloud opens,
Non per il portale
~en Not for the portal;
La gravità graziosa
~en gracious gravity
per me non è più grave.
~en weighs on me no more.


O Dio, se ci sei davvero,
~en O God, if You are really there,
a Te vengo a parlare!
~en I am coming to speak to You!

Non mi fido di Te,
~en I do not trust You,
e non Ti chiedo venia,
~en and I do not ask Your pardon,
ché mai crederò
~en for I will never believe
in [[quello che non mi lasci toccare|8]]!
~en in what You will not let me touch!

[[I muri fiammanti|9]]
~en The flaming walls
del mondo li rompo —
~en of the world — I break them;
Vado oltre i mondi,
~en I go beyond the worlds,
e sino ad [[Andromeda|10]]: addio.
~en as far as Andromeda: farewell.

E a Te, darò un bacio.
~en And to You, I will give a kiss.
Ed a [[Lucifero|11]] pure!
~en And to Lucifer as well!

*Qual io fui vivo,*
~en What I was alive,
*tal son morto!*
~en such am I dead!

# V. PLUS ULTRA
~en V. FURTHER BEYOND

Su le colonne antiche
~en On the ancient columns
stava inciso: [[*non plus ultra.*|12]]
~en was carved: non plus ultra.
Non oltre. Fermati.
~en No further. Stop.

[[Nec caelum est,|13]]
~en There is no heaven,
nec profundum est,
~en there is no depth,
nec medium est
~en there is no middle
—così diceva a Roma
~en — so he said in Rome
mentre ardeva!
~en as he burned!

Non giungo.
~en I do not arrive.
Non voglio giungere.
~en I do not want to arrive.

Movo ove il lume
~en I move where the light
ancor non ha un nome,
~en has no name yet,

*plus ultra,*
~en further beyond,
*plus ultra,*
~en further beyond,

e più in là!
~en and further still!
` },

{ id: 'nana', titleNote: 1, title: 'Nana', langs: ['French'], codes: 'FR', dir: 'ltr', script: false, lang: "fr", trTitle: { en: "Nana" },
  notes: {"1": {"en": "A French sonnet in alexandrines, the twelve-syllable classic line of French verse, framed by a refrain couplet. The alexandrine takes its name from the medieval Roman d'Alexandre.<span class=\"nsrc\"><a href=\"https://fr.wikipedia.org/wiki/Alexandrin\" target=\"_blank\" rel=\"noopener\">Wikipédia: Alexandrin</a> · <a href=\"https://fr.wikipedia.org/wiki/Sonnet\" target=\"_blank\" rel=\"noopener\">Wikipédia: Sonnet</a></span>"}, "2": {"en": "My grandmother, whom we call Nana. She loves orchids, and this poem is about her."}, "3": {"en": "Compare Carl Sagan's “we are made of star-stuff” (Cosmos): orchids as fallen stars.<span class=\"nsrc\"><a href=\"https://en.wikiquote.org/wiki/Carl_Sagan\" target=\"_blank\" rel=\"noopener\">Wikiquote: Carl Sagan</a></span>"}, "4": {"en": "The literary past participle of choir, “to fall”: “une étincelle chue du ciel,” a spark fallen from the sky.<span class=\"nsrc\"><a href=\"https://fr.wiktionary.org/wiki/choir\" target=\"_blank\" rel=\"noopener\">Wiktionary</a></span>"}},
  inspiration: {"en": "This poem is for my grandmother, whom we call Nana. She loves orchids, and when I tried to write about her, the orchids kept turning into stars: a field of stardust, every orchid “un petit astre blessé,” a spark that has fallen from the sky, broken, which she picks up, replants and feeds with her grandmother's love until it shines. I think that is how I see what she does for all of us. She takes what is broken and makes it grow, and when my eyes “versent des perles de diamants,” she is the one who wipes them away. I wrote it in French, the language of my childhood and my family. It turns out the first line is truer than it sounds: many orchids really do drink in the night, opening their pores after dark to take in air, and their seeds are so fine they are called dust seeds. A field of stardust is almost exactly right."},
  more: [],
  src: `
*Buvant la nuit pour rendre le jour,*
~en Drinking in the night to give back the day,
*les [[orchidées|2]] de Nana demeurent toujours.*
~en Nana's orchids remain, always.


Nana enchante un champ de [[poussière étoilée|3]].
~en Nana enchants a field of stardust.
Elle bêche et remue la terre nourricière,
~en She digs and turns the nourishing earth,
tout en leur chantant une éternelle prière,
~en singing to them all the while an endless prayer,
et chaque orchidée, un petit astre blessé.
~en and every orchid is a small, wounded star.

Et quand une étincelle [[chue|4]] du ciel, brisée,
~en And when a spark fallen from the sky, broken,
que Nana recueille de sa main tutélaire,
~en which Nana gathers in her guardian hand,
replante et nourrit de son amour de grand-mère,
~en replants, and feeds with her grandmother's love,
brille — elle sourit d’un grand sourire comblé.
~en shines — she smiles a wide, contented smile.

Et quand mes yeux versent des perles de diamants,
~en And when my eyes pour out pearls of diamond,
des éclats de chagrin, elle essuie ardemment,
~en splinters of grief, she wipes them away fervently,
faisant vivre l’instant; l’apaiser doucement.
~en making the moment live; soothing it gently.

Quand elle ne sera plus là pour nous bercer,
~en When she is no longer here to rock us to sleep,
Nana brillera sur nous, puis sur les bébés,
~en Nana will shine on us, then on the babies,
faisant vivre les fleurs; béantes calmement.
~en making the flowers live; calmly opened wide.


*Buvant la nuit pour rendre l’amour,*
~en Drinking in the night to give back love,
*les orchidées de Nana brilleront toujours.*
~en Nana's orchids will shine forever.
` },

{ id: 'no-tengas-rencor', title: 'No tengas rencor, amor.', untitled: true, langs: ['Spanish'], codes: 'ES', dir: 'ltr', script: false, lang: "es", trTitle: { en: "Don't hold it against me, my love." },
  notes: {"1": {"en": "The poem is addressed to my younger self."}},
  inspiration: {"en": "This one is short and personal: it is me talking to little me. The “amor” I'm asking not to hold it against me is the child I was, and the first thing I want him to know is “no te he olvidado.” Then I tell him what I couldn't see back then: that life is a star “que brilla, brilla,” and at first you don't know it is burning. I call him “niño omnisciente,” because at that age I thought I knew everything, and the one thing he doesn't know is how much of himself he is spending, giving himself away whole “al cielo que ni te mira.” I didn't want to scold him. I wanted him to know I remember."},
  more: [],
  src: `
*No tengas rencor, amor.*
~en Don't hold it against me, my love.
*Sabe que yo*
~en Know that I
*no te he olvidado.*
~en have not forgotten you.

La vida es una estrella
~en Life is a star
que brilla, brilla.
~en that shines and shines.
Antes no sabes que arde,
~en At first you don't know it is burning;
solo da, y da,
~en it only gives, and gives,
rosas rayas buscando
~en pink rays searching
tu ojo llorando.
~en for your weeping eye.

Y tú, [[niño omnisciente|1]],
~en And you, all-knowing child,
quien brillas, brillas,
~en you who shine and shine,
no sabes que ocultas
~en you don't know that you are hiding
te gastas, gastas
~en how you spend yourself, and spend,
te regalas entero
~en you give yourself away entire
\t*al cielo que ni te mira.*
~en to a sky that won't even look at you.

` },

{ id: 'safek', titleNote: 1, title: 'סָפֵק בלי סוף', roma: 'Safek Bli Sof', langs: ['Hebrew'], codes: 'HE', dir: 'rtl', script: true,
  trTitle: { en: 'Doubt Without End' }, lang: "he",
  notes: {"1": {"en": "“Doubt without end” plays on Ein Sof, “without end,” the name for the Infinite. The God-name and the doubt share the phrase.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Ein_Sof\" target=\"_blank\" rel=\"noopener\">Wikipedia: Ein Sof</a></span>"}, "2": {"en": "“The Infinite Light”. In Lurianic Kabbalah, as recorded by Chaim Vital in Etz Chaim, the light of Ein Sof first fills everything, leaving no room (lo hayah makom) for a world.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Lurianic_Kabbalah\" target=\"_blank\" rel=\"noopener\">Wikipedia: Lurianic Kabbalah</a> · <a href=\"https://en.wikipedia.org/wiki/Isaac_Luria\" target=\"_blank\" rel=\"noopener\">Wikipedia: Isaac Luria</a></span>"}, "3": {"en": "Tzimtzum: God's contraction, or withdrawal, of the infinite light to leave an empty space (chalal), into which a single line of light (kav) enters, the exact sequence of these lines. The same root returns at the end (<bdi lang=\"he\">יִצְטַמְצֵם</bdi>), when the story contracts into a book.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Tzimtzum\" target=\"_blank\" rel=\"noopener\">Wikipedia: Tzimtzum</a></span>"}, "4": {"en": "Shevirat ha-kelim, “the breaking of the vessels”: the vessels made to hold the light could not contain it and shattered, scattering sparks (nitzotzot) into all things. In Luria, gathering those sparks is the work of tikkun.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Lurianic_Kabbalah\" target=\"_blank\" rel=\"noopener\">Wikipedia: Lurianic Kabbalah</a></span>"}, "5": {"en": "It recalls seder hishtalshelut, the Kabbalistic chain of descent of the worlds from the Infinite down to this one. My chain runs from the voice down to me.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Seder_hishtalshelus\" target=\"_blank\" rel=\"noopener\">Wikipedia: Seder hishtalshelus</a></span>"}, "6": {"en": "“In the beginning was a voice” joins Genesis 1:1 to John 1:1 (“In the beginning was the Word”). The voice then breaks into tongues (safot), as at Babel, where safah is the word for language (Genesis 11:1).<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Genesis.1.1\" target=\"_blank\" rel=\"noopener\">Sefaria: Genesis 1:1</a> · <a href=\"https://www.sefaria.org/Genesis.11.1\" target=\"_blank\" rel=\"noopener\">Sefaria: Genesis 11:1</a> · <a href=\"https://en.wikipedia.org/wiki/John_1:1\" target=\"_blank\" rel=\"noopener\">Wikipedia: John 1:1</a></span>"}, "7": {"en": "In Hebrew davar means both “word” and “thing,” which is why I wrote “words / things.”<span class=\"nsrc\"><a href=\"https://en.wiktionary.org/wiki/%D7%93%D7%91%D7%A8\" target=\"_blank\" rel=\"noopener\">Wiktionary</a></span>"}, "8": {"en": "Eve from Adam's rib (tzela), Genesis 2:21–22.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Genesis.2.21\" target=\"_blank\" rel=\"noopener\">Sefaria: Genesis 2:21</a></span>"}, "9": {"en": "The four worlds of Kabbalah: Atzilut (Emanation), Beriah (Creation), Yetzirah (Formation) and Assiah (Action), the levels between the divine and this world.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Four_Worlds\" target=\"_blank\" rel=\"noopener\">Wikipedia: Four Worlds</a></span>"}, "10": {"en": "The “You said” lines quote Isaiah 44–45: “I am the Lord who makes all things, who alone stretched out the heavens” (44:24), “who calls you by your name” (45:3), “I form light and create darkness” (45:7), “Truly You are a God who hides Himself” (45:15). In 45:4 God says “I called you by your name… though you have not known Me.” I turn it around: if You called me by my name, why do I not know You?<span class=\"nsrc\"><a href=\"https://www.chabad.org/library/bible_cdo/aid/15976/jewish/Chapter-45.htm\" target=\"_blank\" rel=\"noopener\">Chabad.org: Isaiah 45</a> · <a href=\"https://www.sefaria.org/Isaiah.44.24\" target=\"_blank\" rel=\"noopener\">Sefaria: Isaiah 44:24</a></span>"}, "11": {"en": "Isaiah 45:11, in one traditional reading: “Ask Me of the things to come (ha-otiyot).” There the word means “the coming things” or “signs”. It sounds the same as <bdi lang=\"he\">אוֹתִיּוֹת</bdi>, “letters”, and in later spelling is written like it: the word the poem has just used (“letters of light”).<span class=\"nsrc\"><a href=\"https://www.chabad.org/library/bible_cdo/aid/15976/jewish/Chapter-45.htm\" target=\"_blank\" rel=\"noopener\">Chabad.org: Isaiah 45</a> · <a href=\"https://www.sefaria.org/Isaiah.45.11\" target=\"_blank\" rel=\"noopener\">Sefaria: Isaiah 45:11</a></span>"}},
  inspiration: {"en": "This poem is built on Lurianic Kabbalah, the creation story Chaim Vital records in Etz Chaim. In it the infinite light fills everything, so there is no room for a world. It contracts itself to leave a void and sends in a single line of light, and the vessels made to hold that light shatter, scattering sparks into everything. The poem tells that story and then keeps going down, from a voice to tongues, to words and things, to Adam and Eve, to us, to speech, to a word, and to me. Then it tries to climb back up. I think that shape is the poem: the descent is the world being made, and the ascent is me trying to hold it. I can't, for the same reason the vessels couldn't: “ki rav ha-or min ha-keli,” the light was greater than the vessel. The world sits in a solar system, the universe takes up room inside a story, the story contracts into a book, and the book is made of letters of light. Then it chokes. If everything comes from Him, why can't I see Him? In the last section I turn Isaiah's words back on God: You said You are the one who calls me by name, so why don't I know You? The title plays on Ein Sof, “without end,” the Kabbalistic name for the Infinite. In my version, what has no end is the doubt."},
  more: [{"label": "Chaim Vital, Sefer Etz Chaim", "en": "The record of Isaac Luria's Kabbalah that the poem is built on.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Hayyim_Vital\" target=\"_blank\" rel=\"noopener\">Wikipedia: Hayyim Vital</a> · <a href=\"https://en.wikipedia.org/wiki/Lurianic_Kabbalah\" target=\"_blank\" rel=\"noopener\">Wikipedia: Lurianic Kabbalah</a></span>"}, {"label": "The Tanakh", "en": "The Hebrew Bible.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/texts/Tanakh\" target=\"_blank\" rel=\"noopener\">Sefaria: Tanakh</a></span>"}],
  src: `
# הַיְרִידָה
= ha-yeridah
~en The Descent

[[אוֹר אֵין־סוֹף|2]]
= Or Ein Sof
~en Light without end.
מִלֵּא הַכֹּל, וְלֹא הָיָה מָקוֹם
= mille ha-kol, ve-lo hayah makom
~en It filled all, and there was no room.
[[צִמְצֵם|3]] אֶת־עַצְמוֹ, וַיְהִי חָלָל
= tzimtzem et-atzmo, va-yehi chalal
~en It contracted itself, and there was a void.
וּבֶחָלָל — קַו שֶׁל אוֹר
= u-ve-chalal — kav shel or
~en And in the void — a line of light.
וְהָאוֹר בִּקֵּשׁ כֵּלִים
= ve-ha-or bikkesh kelim
~en And the light sought vessels.
עָשׂוּ לוֹ כֵּלִים, וְלֹא הֵכִילוּ
= asu lo kelim, ve-lo hekhilu
~en They made it vessels, and they could not contain it.
כִּי רַב הָאוֹר מִן־הַכְּלִי
= ki rav ha-or min ha-keli
~en For the light was greater than the vessel.
[[וַיִּשָּׁבְרוּ|4]]. וַיִּפְּלוּ נִיצוֹצוֹת
= va-yishavru. va-yiplu nitzotzot
~en And they shattered. And sparks fell.
נִיצוֹץ בְּכָל־דָּבָר, נִיצוֹץ בְּכָל־אָדָם
= nitzotz be-khol davar, nitzotz be-khol adam
~en A spark in every thing, a spark in every man.

# [[הַשַּׁרְשֶׁרֶת|5]]
= ha-sharsheret
~en The Chain

[[בְּרֵאשִׁית הָיָה קוֹל|6]]
= bereshit hayah kol
~en In the beginning was a voice.
וּמִשֶּׁנִּשְׁבַּר הַקּוֹל — הָיוּ שָׂפוֹת
= u-mishe-nishbar ha-kol — hayu safot
~en And when the voice broke — there were tongues.

וּבַשָּׂפוֹת הָיוּ [[דְּבָרִים|7]]
= u-va-safot hayu dvarim
~en And in the tongues were words / things.
וּמִדָּבָר אֶחָד — אָדָם
= u-mi-davar echad — adam
~en And from one word — a man.
[[מִצַּלְעוֹ|8]] צָמְחָה חַוָּה
= mi-tzal'o tzamchah Chavah
~en From his rib grew Eve.
וּמִשְּׁנֵיהֶם — אֲנַחְנוּ
= u-mi-shneihem — anachnu
~en And from the two of them — we.
וּבָנוּ שָׁכְנוּ קוֹלוֹת
= u-vanu shakhnu kolot
~en And in us dwelt voices.
וּבַקּוֹלוֹת — הַדִּבּוּר
= u-va-kolot — ha-dibbur
~en And in the voices — speech.
וּבַדִּבּוּר — מִלָּה
= u-va-dibbur — milah
~en And in the speech — a word.
וְהַמִּלָּה הַהִיא הָיְתָה אֲנִי
= ve-ha-milah ha-hi haytah ani
~en And that word became me.

# [ נְשִׁימָה ]
= neshimah
~en [ Breath ]

# הָעֲלִיָּה
= ha-aliyah
~en The Ascent

וַאֲנִי — חֵלֶק מִן־הָעוֹלָם
= va-ani — chelek min ha-olam
~en And I — a part of the world.
וְהָעוֹלָם נִשְׁפָּךְ בְּתוֹכִי
= ve-ha-olam nishpach be-tokhi
~en And the world pours into me.
אֲנִי כּוֹתֵב, וְהַשָּׂפוֹת נִכְנָסוֹת בִּי
= ani kotev, ve-ha-safot nikhnasot bi
~en I write, and the tongues enter into me.
אֲנִי אוֹהֵב אוֹתָן, וְהֵן מְמַלְּאוֹת אוֹתִי
= ani ohev otan, ve-hen memal'ot oti
~en I love them, and they fill me.
וְאֵיךְ יָכֹל אֲנִי לְהָכִיל אֶת־הָעוֹלָם
= ve-eikh yakhol ani lehakhil et ha-olam
~en And how can I contain the world,
וְהָעוֹלָם — הֲלֹא יֵשֵׁב בְּמַעֲרֶכֶת שֶׁמֶשׁ
= ve-ha-olam — halo yeshev be-ma'arekhet shemesh
~en when the world itself must sit in a solar system,
וְהַשֶּׁמֶשׁ תִּכָּנֵס בַּיְקוּם
= ve-ha-shemesh tikanes ba-yekum
~en and the sun must fit inside the universe,
וְהַיְקוּם יִתְפֹּס מָקוֹם בְּתוֹךְ סִפּוּר
= ve-ha-yekum yitpos makom be-tokh sippur
~en and the universe takes up room inside a story,
וְהַסִּפּוּר יִצְטַמְצֵם בְּתוֹךְ סֵפֶר
= ve-ha-sippur yitztamtzem be-tokh sefer
~en and the story contracts itself inside a book —
וְהַסֵּפֶר, אוֹמְרִים, מֵאוֹתִיּוֹת נַעֲשָׂה
= ve-ha-sefer, omrim, me-otiyot na'asah
~en and the book, they say, was made from letters,
וְהָאוֹתִיּוֹת — אוֹתִיּוֹת שֶׁל אוֹר
= ve-ha-otiyot — otiyot shel or
~en and the letters — letters of light,

וְהָאוֹר — דִּבְרֵי אֱמֶת
= ve-ha-or — divrei emet
~en and the light — words of truth,
וְהָאֱמֶת, אוֹמְרִים, מִמֶּנּוּ יָצְאָה
= ve-ha-emet, omrim, mimenu yatz'ah
~en and the truth, they say, came out from Him.

# [ נְשִׁימָה ]
= neshimah
~en [ Breath ]

# הַמַּחֲנָק
= ha-machanak
~en The Choking

וְאִם מִמֶּנּוּ הַכֹּל
= ve-im mimenu ha-kol
~en And if all is from Him —
לָמָּה לֹא אֶרְאֶה אוֹתוֹ
= lamah lo er'eh oto
~en why do I not see Him?
לָמָּה נִסְתָּר, לָמָּה שׁוֹתֵק
= lamah nistar, lamah shotek
~en Why hidden, why silent?
לָמָּה [[אַרְבָּעָה עוֹלָמוֹת|9]] בֵּינִי וּבֵינוֹ
= lamah arba'ah olamot beini u-veino
~en Why four worlds between me and Him?
לָמָּה, לָמָּה, לָמָּה
= lamah, lamah, lamah
~en Why, why, why?
אֵין סוֹף — מִי אַתָּה
= Ein Sof — mi atah
~en Infinite — who are You?

# [[הַהִתְגַּלּוּת הַהֲפוּכָה|10]]
= ha-hitgalut ha-hafukhah
~en The Inverted Revelation

אָמַרְתָּ: אָנֹכִי עֹשֶׂה כֹּל
= amarta: Anokhi oseh kol
~en You said: I am the one who makes all.
אָמַרְתָּ: נֹטֶה שָׁמַיִם לְבַדִּי
= amarta: noteh shamayim levadi
~en You said: I alone stretch out the heavens.
אָמַרְתָּ: יוֹצֵר אוֹר וּבוֹרֵא חֹשֶׁךְ
= amarta: yotzer or u-vore choshekh
~en You said: I form light and create darkness.
אָמַרְתָּ: אֲנִי הַקּוֹרֵא בְשִׁמְךָ
= amarta: ani ha-kore be-shimkha
~en You said: I am the one who calls you by name.
אִם קָרָאתָ בִשְׁמִי — לָמָּה לֹא אֵדַע אוֹתְךָ
= im karata bi-shmi — lamah lo eda otkha
~en If You called me by my name — why do I not know You?


אִם אַתָּה יוֹצֵר הָאוֹר — לָמָּה אֲנִי בַּחֹשֶׁךְ
= im atah yotzer ha-or — lamah ani ba-choshekh
~en If You form the light — why am I in the dark?
[[הָאוֹתִיּוֹת שְׁאָלוּנִי|11]], אָמַרְתָּ
= ha-otiyot she'aluni, amarta
~en Ask Me of the things to come, You said,
וְאָנֹכִי — שׁוֹאֵל, וְאֵין עוֹנֶה
= ve-anokhi — sho'el, ve-ein oneh
~en and I — I ask, and none answers.
אָכֵן אַתָּה אֵל מִסְתַּתֵּר
= akhen atah El mistater
~en Truly You are a God who hides —
הַאִם הִסְתַּתַּרְתָּ כָּל־כָּךְ עָמֹק
= ha-im histatarta kol kakh amok
~en have You hidden Yourself so deep
עַד שֶׁאַתָּה בְּעַצְמְךָ
= ad she-atah be-atzmekha
~en that even You

אֵינְךָ מוֹצֵא אֶת־עַצְמְךָ
= eynkha motze et-atzmekha
~en cannot find Yourself?
` },

{ id: 'lashon', title: 'לָשׁוֹן', roma: 'Lashon', langs: ['Hebrew'], codes: 'HE', dir: 'rtl', script: true, lang: "he", trTitle: { en: "Tongue" },
  notes: {"1": {"en": "“A two-edged sword”, literally “a sword of mouths” (pi, mouth): the tongue is built into the idiom. Psalm 149:6; compare Proverbs 5:4 (“sharp as a two-edged sword”) and Judges 3:16.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Psalms.149.6\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 149:6</a> · <a href=\"https://www.sefaria.org/Proverbs.5.4\" target=\"_blank\" rel=\"noopener\">Sefaria: Proverbs 5:4</a></span>"}, "2": {"en": "Proverbs 18:21, quoted exactly: “Death and life are in the power of the tongue.” “Hem omrim,” “they say,” marks it as a quotation.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Proverbs.18.21\" target=\"_blank\" rel=\"noopener\">Sefaria: Proverbs 18:21</a></span>"}, "3": {"en": "“The tongue is holy” plays on lashon ha-kodesh, “the holy tongue”, the traditional name for Hebrew. Lashon means both “tongue” and “language”, which is why the English keeps “tongue” throughout.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Lashon_Hakodesh\" target=\"_blank\" rel=\"noopener\">Wikipedia: Lashon Hakodesh</a></span>"}, "4": {"en": "The form וָאָבֹא, “and I came,” is biblical (as in Genesis 24:42, “I came today to the spring”). In biblical idiom, “to come into” can also mean sexual union.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Genesis.24.42\" target=\"_blank\" rel=\"noopener\">Sefaria: Genesis 24:42</a></span>"}},
  inspiration: {"en": "Lashon means both tongue and language, and this poem is about both at once: the Hebrew language, and the tongue itself, the muscle in your mouth. Hebrew is traditionally called lashon ha-kodesh, the holy tongue, so I began there: “The tongue is holy, and so it is a two-edged sword.” Then I quoted Proverbs 18:21, “death and life are in the power of the tongue,” which in Hebrew is literally “in the hand of the tongue.” The rabbis of the Talmud asked about that exact phrase: does the tongue have a hand? Their answer was that just as a hand can kill, a tongue can kill. The verse in Proverbs goes on, “those who love it will eat its fruit.” My poem doesn't promise fruit. It gives a warning instead: whoever takes hold of it should beware it doesn't cut him. “It was not I who came to the tongue: / I came into the tongue, and the tongue came into me.” I don't think you simply pick a language up and use it. It goes both ways, and in the end “In it I think, and by it I see.” So the same thing that can cut you is the thing you see through."},
  more: [{"label": "The Talmud", "en": "The Babylonian Talmud.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/texts/Talmud\" target=\"_blank\" rel=\"noopener\">Sefaria: Talmud</a></span>"}],
  src: `
הַלָּשׁוֹן קְדוֹשָׁה, וְעַל־כֵּן [[חֶרֶב פִּיפִיּוֹת|1]]
= Ha-lashon kdoshah, ve-al ken cherev pifiyot
~en The tongue is holy, and so it is a two-edged sword;
הֵם אוֹמְרִים: מָוֶת וְחַיִּים [[בְּיַד־לָשׁוֹן|2]]
= Hem omrim: mavet ve-chayyim be-yad lashon
~en they say: death and life are in the power of the tongue,
וְהָאוֹחֵז בָּהּ — יִזָּהֵר פֶּן תַּחְתֹּךְ בּוֹ
= Ve-ha-ochez bah — yizaher pen tachtokh bo
~en and whoever takes hold of it, let him beware it does not cut him.


לֹא אֲנִי בָּאתִי [[אֶל־הַלָּשׁוֹן|3]]
= Lo ani bati el ha-lashon
~en It was not I who came to the tongue:
[[וָאָבֹא|4]] בַּלָּשׁוֹן וְהַלָּשׁוֹן בִּי בָּאָה
= va-avo ba-lashon ve-ha-lashon bi ba'ah
~en I came into the tongue, and the tongue came into me.
בָּהּ אֲנִי חוֹשֵׁב, וַאֲנִי רוֹאֶה בָּהּ
= Bah ani choshev, va-ani ro'eh bah
~en In it I think, and by it I see.
` },

{ id: 'maskil', titleNote: 1, title: 'מַשְׂכִּיל לְזֶרַע יִשְׂרָאֵל', roma: 'Maskil le-Zera Yisrael', langs: ['Hebrew'], codes: 'HE', dir: 'rtl', script: true, lang: "he", trTitle: { en: "A Maskil of the Zera Yisrael" },
  notes: {"1": {"en": "Maskil is the heading of several psalms. This title follows Psalm 42, which the poem opens by quoting: <bdi lang=\"he\">מַשְׂכִּיל לִבְנֵי־קֹרַח</bdi>, “a maskil of the Korahites” (JPS, NRSV). There the Hebrew le- marks belonging, which can be read “by” or “for”: by the Zera Yisrael (the speaker is one of them), or for them (a maskil is a poem of instruction). English “of” keeps both. From the 18th century maskil also meant a follower of the Haskalah, the Jewish Enlightenment: “I measure the world in number and in doubt.” Zera Yisrael, “seed of Israel,” is a term in Jewish law for someone of Jewish descent who is not counted as Jewish under the traditional rule.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Zera_Yisrael\" target=\"_blank\" rel=\"noopener\">Wikipedia: Zera Yisrael</a> · <a href=\"https://www.sefaria.org/Psalms.42.1\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 42:1</a> · <a href=\"https://en.wikisource.org/wiki/Gesenius%27_Hebrew_Grammar/129._Expression_of_the_Genitive_by_Circumlocution\" target=\"_blank\" rel=\"noopener\">Gesenius, Hebrew Grammar §129</a> · <a href=\"https://en.wikipedia.org/wiki/Haskalah\" target=\"_blank\" rel=\"noopener\">Wikipedia: Haskalah</a></span>"}, "2": {"en": "Psalm 42:2, quoted exactly: “As a deer longs for streams of water, so my soul longs for You, O God.” The next line takes the words of Psalm 63:2, “my soul thirsts for You”, in place of 42:3’s “for God”.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Psalms.42.2\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 42:2</a> · <a href=\"https://www.sefaria.org/Psalms.63.2\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 63:2</a></span>"}, "3": {"en": "The stanza weaves together Jonah 2:4 (“You cast me into the deep, into the heart of the seas… all Your breakers and waves passed over me”), Psalm 42:8 (“Deep calls to deep”), rewritten as “wave called out to wave”, and Psalm 69:2 (“the waters have come up to my soul”).<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Jonah.2.4\" target=\"_blank\" rel=\"noopener\">Sefaria: Jonah 2:4</a> · <a href=\"https://www.sefaria.org/Psalms.42.8\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 42:8</a> · <a href=\"https://www.sefaria.org/Psalms.69.2\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 69:2</a></span>"}, "4": {"en": "Psalm 69:35, quoted exactly: “Let heaven and earth praise Him, the seas and everything that moves in them.”<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Psalms.69.35\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 69:35</a></span>"}, "5": {"en": "“Other waters”: baptism, set against the Jewish ritual immersion of the mikveh. Hebrew uses the same root, <bdi lang=\"he\">ט־ב־ל</bdi>, for both.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Mikveh\" target=\"_blank\" rel=\"noopener\">Wikipedia: Mikveh</a></span>"}, "6": {"en": "Psalm 69:4, quoted exactly: “My eyes fail while I wait for my God.” Psalm 69, a psalm of drowning (“I have sunk in deep mire”, 69:3), runs under the whole poem, and “etba,” I will drown, echoes 69:3, “tava'ti.”<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Psalms.69.4\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 69:4</a> · <a href=\"https://www.sefaria.org/Psalms.69.3\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 69:3</a></span>"}, "7": {"en": "Psalm 119:18, “Gal einai ve-abitah”, “Open my eyes, that I may behold.” Here gal is the imperative of “uncover”, spelled the same as gal, “wave”, from the second stanza: two different words with one spelling.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Psalms.119.18\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 119:18</a></span>"}, "8": {"en": "Hagah: to murmur, recite or meditate, as in Psalm 1:2, “on His Torah he meditates day and night.”<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Psalms.1.2\" target=\"_blank\" rel=\"noopener\">Sefaria: Psalms 1:2</a></span>"}, "9": {"en": "Tehom, “the deep”, the primeval deep of Genesis 1:2. The poem ends with the writer's head lifted above the same deep.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/Genesis.1.2\" target=\"_blank\" rel=\"noopener\">Sefaria: Genesis 1:2</a></span>"}},
  inspiration: {"en": "This is probably my most personal poem in Hebrew. My father's side is Jewish, and the poem lives in the space between that side of me and the other. In Jewish law there is a term for someone like me, zera Yisrael, the seed of Israel, and it became my title. The poem is my reflection on religion and on that tension in my history and origin. I read the Psalms and they tell everything to praise, heaven and earth and the seas. But how am I to praise, when my grandmother did not know Hebrew and imi, my mother, was immersed in other waters? I don't believe the way they believed; I measure the world in number and in doubt. And still, when I say an ancient word, something in me kneels. So I borrowed the oldest Hebrew I could find, the Psalms of longing and of drowning, and I wrote the way the last stanza says: so that I can breathe, and so that I don't drown."},
  more: [{"label": "The Tanakh", "en": "The Hebrew Bible.<span class=\"nsrc\"><a href=\"https://www.sefaria.org/texts/Tanakh\" target=\"_blank\" rel=\"noopener\">Sefaria: Tanakh</a></span>"}],
  src: `
[[כְּאַיָּל תַּעֲרֹג|2]] עַל־אֲפִיקֵי מָיִם
= Ke-ayal ta'arog al afikei mayim
~en As a deer longs for streams of water,
כֵּן נַפְשִׁי תַעֲרֹג אֵלֶיךָ אֱלֹהִים
= Ken nafshi ta'arog eilekha Elohim
~en so my soul longs for You, O God.
צָמְאָה לְךָ נַפְשִׁי
= Tzam'ah lekha nafshi
~en My soul thirsts for You,
אַךְ יָרֵאתִי פֶּן־לֹא תַעֲנֶה
= Akh yareti pen lo ta'aneh
~en but I was afraid You would not answer.

וַתַּשְׁלִיכֵנִי מְצוּלָה בִּלְבַב יַמִּים
= Va-tashlikheni metzulah bi-lvav yamim
~en You cast me into the deep, into the heart of the seas;
מִשְׁבָּר עַל מִשְׁבָּר עָבַר עָלַי
= Mishbar al mishbar avar alai
~en breaker upon breaker swept over me,
וַיִּקְרָא [[גַּל|3]] אֶל גַּל בַּלָּיְלָה
= Va-yikra gal el gal ba-laylah
~en and wave called out to wave in the night,
וְלֹא נִשְׁמַע עוֹד, כִּי עַד־נֶפֶשׁ בָּאוּ מָיִם
= Ve-lo nishma od, ki ad nefesh ba'u mayim
~en and was heard no more, for the waters had come up to my soul.

קוֹרֵא אֲנִי בַּתְּהִלִּים
= Kore ani ba-Tehillim
~en I read in the Psalms:
[[יְהַלְלוּהוּ שָׁמַיִם וָאָרֶץ|4]]
= Yehaleluhu shamayim va-aretz
~en let heaven and earth praise Him,
יַמִּים וְכָל־רֹמֵשׂ בָּם
= Yamim ve-khol romes bam
~en the seas, and everything that moves in them.
אַךְ אֵיךְ אֲהַלֵּל
= Akh eikh ahalel
~en But how am I to praise?

וְסָבָתִי לֹא יָדְעָה עִבְרִית
= Ve-savati lo yad'ah ivrit
~en My grandmother did not know Hebrew,
וְאִמִּי הִטְבִּילוּהָ [[בְּמַיִם אֲחֵרִים|5]]
= Ve-imi hitbiluha be-mayim acherim
~en and my mother was immersed in other waters.
אֵינֶנִּי מַאֲמִין כְּפִי שֶׁהֵם הֶאֱמִינוּ
= Eineni ma'amin kefi she-hem he'eminu
~en I do not believe the way they believed;
אֲנִי מוֹדֵד עוֹלָם בְּמִסְפָּר וּבְסָפֵק
= Ani moded olam be-mispar u-ve-safek
~en I measure the world in number and in doubt.

[[כָּלוּ עֵינַי מְיַחֵל לֵאלֹהָי|6]]
= Kalu einai meyachel l'Elohai
~en My eyes have worn out, waiting for my God.
[[גַּל עֵינַי|7]] וְאַבִּיטָה, אֱלֹהָי
= Gal einai ve-abitah, Elohai
~en Open my eyes, that I may see, my God:
מַדּוּעַ כְּשֶׁאֲנִי [[הוֹגֶה|8]] מִלָּה עַתִּיקָה
= Madua kshe-ani hogeh milah atikah
~en why, when I murmur an ancient word,
מַשֶּׁהוּ קוֹרֶה בִּי, מַשֶּׁהוּ בִּי כּוֹרֵעַ
= Mashehu koreh bi, mashehu bi korea
~en does something happen in me, something in me kneel?

עַל־כֵּן אֶכְתֹּב לְמַעַן אֶשְׁאַף רוּחַ
= Al ken ekhtov le-ma'an esh'af ruach
~en So I write, that I may draw breath;
אֶכְתֹּב לְמַעַן לֹא אֶטְבַּע
= Ekhtov le-ma'an lo etba
~en I write so that I will not drown,
כִּי הַכּוֹתֵב מֵרִים רֹאשׁוֹ
= Ki ha-kotev merim rosho
~en for the one who writes lifts his head,
מְעַט מְעַט מֵעַל [[הַתְּהוֹם|9]]
= Me'at me'at me'al ha-tehom
~en little by little, above the deep.
` },

{ id: '777', titleNote: 1, title: '777', langs: ['Spanish'], codes: 'ES', dir: 'ltr', script: false, lang: "es", trTitle: { en: "777" },
  notes: {"1": {"en": "Seven prisms of the sun and seven blows. A prism splits sunlight into seven colours in Newton's count: in Opticks (1704) he added orange and indigo partly so the count would match the seven notes of the musical scale.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Opticks\" target=\"_blank\" rel=\"noopener\">Wikipedia: Opticks</a> · <a href=\"https://en.wikipedia.org/wiki/ROYGBIV\" target=\"_blank\" rel=\"noopener\">Wikipedia: ROYGBIV</a></span>"}, "2": {"en": "Góngora's sonnet “Mientras por competir con tu cabello” (1582). My opening copies his opening, and the mientras… mientras… mientras structure follows his run of “while…” clauses. His sonnet ends on “en tierra, en humo, en polvo, en sombra, en nada”; mine answers with “el aire, el fuego, el trueno y la mente,” and his humo, smoke, becomes my “me ahúma.”<span class=\"nsrc\"><a href=\"https://es.wikisource.org/wiki/Mientras_por_competir_con_tu_cabello\" target=\"_blank\" rel=\"noopener\">Wikisource</a></span>"}, "3": {"en": "An echo of “Sakura”: “raíz a rama — rojo mutado.”"}, "4": {"en": "Claroscuro: chiaroscuro, the painter's play of strong light and shadow. The word joins claro, light, and oscuro, dark.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Chiaroscuro\" target=\"_blank\" rel=\"noopener\">Wikipedia: Chiaroscuro</a></span>"}, "5": {"en": "Rogar is both to pray and to beg."}, "6": {"en": "A supernova is the explosive death of a star, briefly outshining its whole galaxy: the destello último, the last flash. Compare the lines that open the collection (“QUE IMPLOTANDO EXPLOTE”).<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Supernova\" target=\"_blank\" rel=\"noopener\">Wikipedia: Supernova</a></span>"}},
  inspiration: {"en": "777 is a synesthetic poem. Light bites, blows bruise, air and blood turn into smoke, and the sun answers by exploding into gold. I started from Góngora. His sonnet “Mientras por competir con tu cabello” is a run of “while” clauses telling a young woman to enjoy her beauty before it all turns “en tierra, en humo, en polvo, en sombra, en nada.” I took his opening and his whiles, but I wanted to go the other way. His list sinks into earth, smoke and nothing. Mine calls on “el aire, el fuego, el trueno y la mente,” things that rise. In his poem time does the damage slowly. In mine the elements hit me in the face, in the eye and on the lips: “siete prismas del sol le muerden fuego,” “siete golpes magullan, los enduro.” A prism splits sunlight into seven colours, at least in Newton's count, and Newton settled on seven partly to match the seven notes of a musical scale, which fits a poem where the sun answers. Góngora's smoke comes back too, as “me ahúma,” but here the smoke is in me. The ending is a supernova, and it ties back to the very beginning, the entry of the whole collection: “QUE IMPLOTANDO EXPLOTE.” The last poem ends as a call back to the first line."},
  more: [{"label": "Luis de Góngora, “Mientras por competir con tu cabello” (1582)", "en": "The sonnet the poem starts from.<span class=\"nsrc\"><a href=\"https://es.wikisource.org/wiki/Mientras_por_competir_con_tu_cabello\" target=\"_blank\" rel=\"noopener\">Wikisource</a></span>"}],
  src: `
[[Mientras por competir|2]] con tu ojo puro,
~en While, to compete with your pure eye,
siete prismas del sol le muerden fuego;
~en seven prisms of the sun bite fire from it;
mientras, en fractales del mundo ciego,
~en while, in the fractals of the blind world,
siete golpes magullan, los enduro;
~en seven blows bruise me, and I endure them;

Mientras con ambos labios al sol juro,
~en while with both lips I swear to the sun
no negar mi sed que es sin sosiego;
~en never to deny my thirst, which knows no rest;
mientras me ahúma aire sangre, me entrego,
~en while air and blood fill me with smoke, I give myself,
[[de la raíz a rama|3]], al [[claroscuro|4]]:
~en from the root to the branch, to the chiaroscuro:

[[ruego|5]] el aire, el fuego, el trueno y la mente,
~en I beg the air, the fire, the thunder and the mind,
y responde el sol al explotar en oro,
~en and the sun answers, bursting into gold,
matando pensamientos de repente.
~en killing every thought at once.

No solo en luz o en halo me enamoro,
~en Not only in light or in a halo do I fall in love,
mas con destello último, juntamente,
~en but with one last flash, all together,
en llanto [[supernova|6]], ardo y me muero.
~en in a supernova of tears, I burn and I die.
` }

];

<script>
(function () {
  const L = SITE.lang;
  const UI = { en: {
    translate: 'Translate', enter: 'Enter Anthology I →', preface: 'Preface', bibliography: 'Bibliography', index: 'Anthology I', aPreface: 'Prologue',
    about: 'About this poem', aboutTBD: '[The inspiration behind the poem — TBD]', notes: 'Notes', noteTBD: '[Note — TBD]',
    roma: 'Romanization', tr: 'Translation', soon: 'soon', note: 'Note', original: 'Original', more: 'Inspiration', sources: 'Sources and inspirations', poems: 'Poems', pick: 'Go to poem', prev: 'Previous', next: 'Next', site: 'Alex Bahia', poetry: 'Poetry'
  } }[L];
  const LANGNAME = { en: 'English', fr: 'Français', es: 'Español' };
  const app = document.getElementById('app');
  const card = document.getElementById('card');
  const state = { roma: false, split: false, note: null, poem: null };
  try { const s = JSON.parse(localStorage.getItem('abp') || '{}'); state.roma = !!s.roma; state.split = !!s.split; } catch (e) {}
  const save = () => { try { localStorage.setItem('abp', JSON.stringify({ roma: state.roma, split: state.split })); } catch (e) {} };

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const isHe = s => /[֐-׿]/.test(s);
  const isBig = s => /[぀-鿿ሀ-፿]/.test(s);
  const lineLang = (s, p, epi) => isHe(s) ? 'he' : /[ሀ-፿]/.test(s) ? 'am' : /[぀-ヿ一-鿿]/.test(s) ? 'ja' :
    (/[Ͱ-Ͽἀ-῿]/.test(s) && !/[a-z]{3}/.test(s.replace(/[Ͱ-Ͽἀ-῿]/g, ''))) ? 'grc' : (epi && p.epiLang) ? p.epiLang : (p.lang || '');
  const langAttr = l => l ? ' lang="' + l + '"' + (l === 'he' ? ' dir="rtl"' : '') : '';

  /* ---------- the poem format ---------- */
  function tok(str) {
    const re = /\[\[([\s\S]+?)\|(\d+)\]\]|\*\*([^*]+)\*\*|\*([^*]+)\*/g;
    const out = []; let last = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > last) out.push({ k: 't', s: str.slice(last, m.index) });
      if (m[1] !== undefined) out.push({ k: 'n', n: +m[2], inner: tok(m[1]) });
      else if (m[3] !== undefined) out.push({ k: 'b', s: m[3] });
      else out.push({ k: 'i', s: m[4] });
      last = re.lastIndex;
    }
    if (last < str.length) out.push({ k: 't', s: str.slice(last) });
    return out;
  }
  const plain = toks => toks.map(t => t.inner ? plain(t.inner) : t.s).join('');
  function inl(toks, notes, have) {
    return toks.map(t => {
      if (t.k === 't') return esc(t.s);
      if (t.k === 'i') return '<i>' + inl(tok(t.s), notes, have) + '</i>';
      if (t.k === 'b') return '<b>' + inl(tok(t.s), notes, have) + '</b>';
      if (have && !have(t.n)) return inl(t.inner);
      if (notes && !notes.some(x => x.n === t.n)) notes.push({ n: t.n, label: plain(t.inner).trim() });
      return '<button type="button" class="a" data-n="' + t.n + '" aria-pressed="false">' + inl(t.inner) + '<sup>' + t.n + '</sup></button>';
    }).join('');
  }
  function parse(src) {
    const rows = src.replace(/^\n+|\s+$/g, '').split('\n');
    const blocks = []; let blank = 0;
    const push = b => {
      const prev = blocks[blocks.length - 1];
      if (blank && prev && b.k !== 'sec' && prev.k !== 'sec') blocks.push({ k: 'gap', n: blank });
      blank = 0; blocks.push(b);
    };
    for (const raw of rows) {
      if (raw.trim() === '') { blank++; continue; }
      const last = blocks[blocks.length - 1];
      if (raw.startsWith('= ')) { if (last) last.roma = raw.slice(2); continue; }
      const tm = raw.match(/^~([a-z]{2}) (.*)$/);
      if (tm) { if (last) { last.tr = last.tr || {}; last.tr[tm[1]] = tm[2]; } continue; }
      let s = raw, indent = 0;
      while (s[0] === '\t') { indent++; s = s.slice(1); }
      if (s.startsWith('# ')) {
        const body = s.slice(2), mm = body.match(/^([IVXLC]+)\.\s+(.+)$/);
        push({ k: 'sec', num: mm ? mm[1] : '', text: mm ? mm[2] : body });
        continue;
      }
      const epi = s.startsWith('> ');
      push({ k: 'line', epi: epi, indent: indent, text: epi ? s.slice(2) : s });
    }
    return blocks;
  }
  const hasTr = p => new RegExp('^~' + L + ' ', 'm').test(p.src);

  /* ---------- views ---------- */
  function setNav(r) {
    document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.r === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }

  /* Inspiration: an optional paragraph (string or {en: ...}) and a sources list, shared by the preface and the poems */
  function inspSection(inspiration, list) {
    const more = (list || []).filter(m => m[L]);
    const insp = typeof inspiration === 'string' ? inspiration : (inspiration && inspiration[L]) || '';
    return (insp || more.length) ? '<section class="more" aria-label="' + UI.more + '"><p class="label">' + UI.more + '</p>' +
      (insp ? '<p class="insp">' + insp + '</p>' : '') +
      (more.length ? (insp ? '<p class="label src">' + UI.sources + '</p>' : '') + '<dl>' +
      more.map(m => '<dt dir="auto"' + (isHe(m.label) ? ' class="he"' : '') + '>' + esc(m.label) + '</dt><dd>' + m[L] + '</dd>').join('') + '</dl>' : '') + '</section>' : '';
  }

  function viewFront() {
    const P = PREFACE[L];
    app.innerHTML =
      '<article class="sheet narrow pref" id="preface-sheet" aria-label="' + UI.preface + '">' +
        '<div class="front">' +
          '<h1 class="sitename">ALEX BAHIA POETRY</h1><div class="redrule"></div>' +
          '<blockquote class="epi" lang="es">' + PIZARNIK.es + '</blockquote>' +
          '<p class="attr sc">— Alejandra Pizarnik</p>' +
          '<div class="epi-tr" id="epiTr" lang="' + L + '" hidden>' + PIZARNIK[L] + '</div>' +
          '<div><button type="button" class="tbtn sc" id="epiBtn" aria-pressed="false" aria-controls="epiTr">' + UI.translate + '</button></div>' +
        '</div>' +
        '<p class="pref-lead">' + P.lead + '</p>' +
        P.body.map(t => '<p>' + t + '</p>').join('') +
        '<h2 class="sc">' + P.langsTitle + '</h2>' +
        P.langs.map(([n, d]) => '<p class="lg"><b class="sc">' + n + '</b> — ' + d + '</p>').join('') +
        '<p class="lg" style="margin-top:22px"><b class="sc">' + P.coda[0] + '</b> ' + P.coda[1] + '</p>' +
        (P.coming ? '<p class="lg coming"><b class="sc">' + P.coming[0] + '</b> ' + P.coming[1] + '</p>' : '') +
        '<p class="front"><a class="enter sc" href="#poems">' + UI.enter + '</a></p>' +
      '</article>';
  }

  /* Anthology I's Prologue: the four opening lines of the anthology */


  function viewAPreface() {
    const first = POEMS[0], tl = q => q.dir === 'rtl' ? ' lang="he" dir="rtl"' : '';
    app.innerHTML =
      '<article class="sheet narrow prologue" id="prologue" aria-label="' + UI.index + ': ' + UI.aPreface + '">' +
        '<h1 class="ixh">' + UI.aPreface.toUpperCase() + '</h1>' +
        '<p class="label red">' + UI.index + '</p>' +
        '<div class="coll-open"><p class="co-es" lang="es">' + COLLECTION_OPENING.map(r => r[0]).join('<br>') + '</p>' +
        '<p class="co-en">' + COLLECTION_OPENING.map(r => r[1]).join('<br>') + '</p></div>' +
        '<nav class="pn" aria-label="Other poems"><a href="#poems">← ' + UI.index + '</a>' +
          '<a href="#p-' + first.id + '"><bdi' + tl(first) + '>' + esc(first.title) + '</bdi> →</a></nav>' +
      '</article>';
  }

  function viewIndex() {
    app.innerHTML = '<article class="sheet narrow" aria-label="' + UI.index + '"><h1 class="ixh">' + UI.index.toUpperCase() + '</h1><ol class="ix">' +
      '<li class="ixpref"><a href="#prologue"><span class="n"></span><span class="t">' + UI.aPreface + '</span><span class="d" aria-hidden="true"></span><span class="c"></span></a></li>' +
      POEMS.map((p, i) => {
        const he = p.dir === 'rtl';
        return '<li><a href="#p-' + p.id + '"><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="t' + (he ? ' he' : '') + (p.untitled ? ' u' : '') + '"' + (he ? ' dir="rtl" lang="he"' : '') + '>' + esc(p.title) + '</span>' +
          '<span class="d" aria-hidden="true"></span><span class="c" title="' + p.langs.join(', ') + '">' + p.codes + '</span></a></li>';
      }).join('') +
      '<li class="ixbib"><a href="#bibliography"><span class="n"></span><span class="t">' + UI.bibliography + '</span><span class="d" aria-hidden="true"></span><span class="c"></span></a></li>' +
      '</ol></article>';
  }

  function viewBiblio() {
    app.innerHTML = '<article class="sheet narrow" aria-label="' + UI.bibliography + '"><h1 class="ixh">BIBLIOGRAPHY</h1><ul class="biblio">' +
      BIBLIO.map(b => '<li>' + b + '</li>').join('') + '</ul>' +
      (POEMS.length ? '<nav class="pn" aria-label="Other poems"><a href="#p-' + POEMS[POEMS.length - 1].id + '">← <bdi' + (POEMS[POEMS.length - 1].dir === 'rtl' ? ' lang="he" dir="rtl"' : '') + '>' + esc(POEMS[POEMS.length - 1].title) + '</bdi></a><a href="#poems">' + UI.index + '</a></nav>' : '') +
      '</article>';
  }

  function viewPoem(id) {
    const i = POEMS.findIndex(p => p.id === id);
    if (i < 0) { location.hash = 'poems'; return; }
    const p = POEMS[i], rtl = p.dir === 'rtl', canTr = hasTr(p);
    const roma = state.roma && p.script, split = state.split && canTr;
    const notes = [];
    const have = p.notes ? n => !!(p.notes[n] && p.notes[n][L]) : null;
    let title = esc(p.title);
    if (p.titleNote && (!have || have(p.titleNote))) { notes.push({ n: p.titleNote, label: p.title }); title = '<button type="button" class="a" data-n="' + p.titleNote + '" aria-pressed="false">' + title + '<sup>' + p.titleNote + '</sup></button>'; }

    let rows = '';
    if (split) {
      const oc = '<div class="o"' + (rtl ? ' dir="rtl"' : '') + '>' + UI.original + ' · ' + p.langs.join(' · ') + '<span class="tt"' + (rtl ? ' lang="he"' : '') + '>' + esc(p.title) + '</span></div>';
      const tc = '<div class="tr">' + LANGNAME[L] + '<span class="tt">' + esc((p.trTitle && p.trTitle[L]) || '') + '</span></div>';
      rows += '<div class="r cols">' + tc + oc + '</div>';
    }
    for (const b of parse(p.src)) {
      if (b.k === 'gap') { rows += '<div aria-hidden="true" style="height:' + (b.n * 1.15).toFixed(2) + 'em"></div>'; continue; }
      if (b.k === 'sec') {
        const cls = isHe(b.text) ? ' he' : isBig(b.text) ? ' big' : '';
        const sl = lineLang(b.text, p, false);
        const hasT = split && b.tr && b.tr[L];
        const os = '<div class="sec' + (hasT ? ' o' : '') + '"' + langAttr(sl) + '>' + (b.num ? '<span class="num">' + b.num + '</span>' : '') +
          '<div class="line"><span class="t' + cls + '">' + inl(tok(b.text), notes, have) + '</span></div>' +
          (roma && b.roma ? '<div class="sro" dir="ltr">' + esc(b.roma) + '</div>' : '') + '</div>';
        if (hasT) {
          const tt = (b.tr && b.tr[L]) || '', tm = tt.match(/^([IVXLC]+)\.\s+(.+)$/);
          const ts = '<div class="sec tr" lang="' + L + '">' + (tm ? '<span class="num">' + tm[1] + '</span>' : '') +
            '<div class="line"><span class="t">' + inl(tok(tm ? tm[2] : tt)) + '</span></div></div>';
          rows += '<div class="r rs">' + ts + os + '</div>';
        } else rows += os;
        continue;
      }
      const ll = lineLang(b.text, p, b.epi);
      const o = '<div class="o"' + (rtl ? ' dir="rtl" lang="he"' : langAttr(ll)) + '><div class="l' + (b.epi ? ' epi' : '') + '" style="--pad:' + (b.indent * 2.6).toFixed(1) + 'em">' + inl(tok(b.text), notes, have) + '</div>' +
        (roma && b.roma ? '<div class="ro" dir="ltr">' + esc(b.roma) + '</div>' : '') + '</div>';
      if (split && !(b.tr && b.tr[L])) rows += '<div class="r solo">' + o + '</div>';
      else if (split) {
        const t = '<div class="tr" lang="' + L + '">' + (b.tr && b.tr[L] ? '<div class="l' + (b.epi ? ' epi' : '') + '" style="--pad:' + (b.indent * 2.6).toFixed(1) + 'em">' + inl(tok(b.tr[L])) + '</div>' : '') + '</div>';
        rows += '<div class="r">' + t + o + '</div>';
      } else rows += '<div class="r">' + o + '</div>';
    }

    const prev = i > 0 ? POEMS[i - 1] : null, next = i < POEMS.length - 1 ? POEMS[i + 1] : null;
    const tl = q => q.dir === 'rtl' ? ' lang="he" dir="rtl"' : '';
    const prevA = prev ? '<a class="pv" href="#p-' + prev.id + '" rel="prev" aria-label="' + UI.prev + ': ' + esc((prev.trTitle && prev.trTitle[L]) || prev.title) + '">←<span class="sn"' + tl(prev) + '>' + esc(prev.title) + '</span></a>'
                       : '<a class="pv" href="#prologue">←<span class="sn">' + UI.aPreface + '</span></a>';
    const nextA = next ? '<a class="nx" href="#p-' + next.id + '" rel="next" aria-label="' + UI.next + ': ' + esc((next.trTitle && next.trTitle[L]) || next.title) + '"><span class="sn"' + tl(next) + '>' + esc(next.title) + '</span>→</a>'
                       : '<a class="nx" href="#bibliography"><span class="sn">' + UI.bibliography + '</span>→</a>';
    const pick = '<label class="sr" for="pick">' + UI.pick + '</label><select id="pick">' +
      POEMS.map((q, j) => '<option value="' + q.id + '"' + (j === i ? ' selected' : '') + '>No. ' + (j + 1) + '/' + POEMS.length + (j === i ? '' : ' · ' + esc((q.trTitle && q.trTitle[L]) || q.title)) + '</option>').join('') + '</select>';
    const strip = '<nav class="strip" aria-label="' + UI.poems + '">' + prevA + '<span class="pk">' + pick + '</span>' + nextA + '</nav>';
    const box = on => '<span class="box">[' + (on ? 'x' : '&nbsp;') + ']</span> ';
    const nbody = n => (p.notes && p.notes[n] && p.notes[n][L]) || UI.noteTBD;
    notes.forEach(nt => { nt.body = nbody(nt.n); });
    const marginNotes = notes.map(nt => '<div class="mn" data-n="' + nt.n + '"><button type="button" class="mh" tabindex="-1" aria-expanded="false"><span class="n">' + nt.n + '</span><span class="lab' + (isHe(nt.label) ? ' he' : '') + '" dir="auto">' + esc(nt.label) + '</span></button><div class="bd">' + nt.body + '</div></div>').join('');
    const moreNotes = inspSection(p.inspiration, p.more);

    app.innerHTML =
      '<article class="sheet' + (split ? ' wide split' : '') + '" aria-label="' + esc(p.roma || p.title) + '">' + strip + '<div class="pg">' +
        '<header class="ph">' +
          '<h1 class="ptitle' + (p.untitled ? ' untitled' : '') + '" tabindex="-1" dir="' + p.dir + '"' + (rtl ? ' lang="he"' : '') + '>' + title + '</h1>' +
          (p.roma ? '<p class="proma">' + esc(p.roma) + '</p>' : '') +
          '<p class="plangs">' + p.langs.join(' · ').toUpperCase() + '</p>' +
          '<div class="ctls">' +
            (p.script ? '<button type="button" class="ctl" data-act="roma" aria-pressed="' + roma + '">' + box(roma) + UI.roma + '</button>' : '') +
            '<button type="button" class="ctl" data-act="split" aria-pressed="' + split + '"' + (canTr ? '' : ' disabled') + '>' + box(split) + UI.tr + (canTr ? '' : ' · ' + UI.soon) + '</button>' +
          '</div>' +
        '</header>' +
        '<aside class="about" aria-label="' + UI.about + '">' + (p.about && p.about[L] ? '<p class="label">' + UI.about + '</p><p class="tx">' + p.about[L] + '</p>' : '') +
          (notes.length ? '<p class="label nl">' + UI.notes + '</p>' : '') + '</aside>' +
        '<div class="rows' + (rows.includes('r solo') ? ' has-solo' : '') + '">' + rows + '</div>' +
        '<div class="margin" aria-label="' + UI.notes + '">' + marginNotes + '</div>' +
      '</div>' + moreNotes +
      '<nav class="pn" aria-label="Other poems">' + (prev ? '<a href="#p-' + prev.id + '">← <bdi' + tl(prev) + '>' + esc(prev.title) + '</bdi></a>' : '<a href="#prologue">← ' + UI.aPreface + '</a>') +
        '<a class="mid" href="#poems">' + UI.index + '</a>' +
        (next ? '<a href="#p-' + next.id + '"><bdi' + tl(next) + '>' + esc(next.title) + '</bdi> →</a>' : '<a href="#bibliography">' + UI.bibliography + ' →</a>') + '</nav>' +
      '</article>';
    state.poem = p;
    state.notes = notes;
    applyNote();
  }

  /* ---------- notes ---------- */
  const narrow = () => window.matchMedia('(max-width: 900px)').matches;
  function placeNotes() {
    const margin = app.querySelector('.margin');
    if (!margin || narrow()) return;
    const base = margin.getBoundingClientRect().top;
    const items = [...margin.querySelectorAll('.mn')].map(mn => {
      const a = app.querySelector('.a[data-n="' + mn.dataset.n + '"]');
      return { mn: mn, y: a ? a.getBoundingClientRect().top - base : 0 };
    }).sort((x, y) => x.y - y.y);
    let cur = 0;
    for (const it of items) {
      const top = Math.max(Math.round(it.y) - (it.mn.classList.contains('on') ? 10 : 2), cur);
      it.mn.style.top = top + 'px';
      cur = top + it.mn.offsetHeight + 10;
    }
    margin.style.minHeight = cur + 'px';
  }
  function applyNote() {
    const n = state.note;
    app.querySelectorAll('.a').forEach(a => a.setAttribute('aria-pressed', String(+a.dataset.n === n)));
    app.querySelectorAll('.mn').forEach(m => { const on = +m.dataset.n === n; m.classList.toggle('on', on); m.querySelector('.mh').setAttribute('aria-expanded', String(on)); });
    const nt = n != null && state.notes ? state.notes.find(x => x.n === n) : null;
    if (nt && narrow()) {
      document.getElementById('cardN').textContent = UI.note + ' ' + n;
      const lab = document.getElementById('cardL');
      lab.textContent = nt.label; lab.className = 'lab' + (isHe(nt.label) ? ' he' : ''); lab.dir = 'auto';
      document.getElementById('cardB').innerHTML = nt.body || UI.noteTBD;
      card.hidden = false;
    } else card.hidden = true;
    placeNotes();
  }
  function toggleNote(n) { state.note = state.note === n ? null : n; applyNote(); }

  /* ---------- routing ---------- */
  let routed = false;
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    state.note = null; state.notes = null; card.hidden = true;
    const T = (...a) => { document.title = a.concat([UI.site]).join(' | '); };
    const focusH = () => { const h1 = app.querySelector('h1'); if (h1 && routed) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); } routed = true; };
    if (h.startsWith('p-')) { setNav('poems'); viewPoem(h.slice(2)); window.scrollTo(0, 0); const p = state.poem; if (p) T((p.trTitle && p.trTitle[L]) || p.title, UI.poetry); focusH(); }
    else if (h === 'poems') { setNav('poems'); viewIndex(); window.scrollTo(0, 0); T(UI.index, UI.poetry); focusH(); }
    else if (h === 'anthology-1-preface') { location.replace('#prologue'); }
    else if (h === 'more') { location.replace('#preface'); }
    else if (h === 'prologue') { setNav('poems'); viewAPreface(); window.scrollTo(0, 0); T(UI.aPreface, UI.index, UI.poetry); focusH(); }
    else if (h === 'bibliography') { setNav('poems'); viewBiblio(); window.scrollTo(0, 0); T(UI.bibliography, UI.poetry); focusH(); }
    else {
      T(UI.poetry); routed = true;
      setNav(h === 'preface' ? 'preface' : '');
      viewFront();
      window.scrollTo(0, 0);
    }
  }

  document.addEventListener('click', e => {
    const a = e.target.closest('.a, .mh');
    if (a) { toggleNote(+(a.dataset.n || a.closest('.mn').dataset.n)); return; }
    if (e.target.closest('#cardX')) { state.note = null; applyNote(); return; }
    const c = e.target.closest('.ctl');
    if (c && !c.disabled && state.poem) {
      if (c.dataset.act === 'roma') state.roma = !state.roma; else state.split = !state.split;
      save();
      const y = window.scrollY, n = state.note;
      viewPoem(state.poem.id);
      state.note = n; applyNote();
      window.scrollTo(0, y);
      const again = app.querySelector('.ctl[data-act="' + c.dataset.act + '"]'); if (again) again.focus();
      return;
    }
    const eb = e.target.closest('#epiBtn');
    if (eb) {
      const on = eb.getAttribute('aria-pressed') !== 'true';
      eb.setAttribute('aria-pressed', String(on));
      document.getElementById('epiTr').hidden = !on;
    }
  });
  document.addEventListener('change', e => { if (e.target.id === 'pick') location.hash = 'p-' + e.target.value; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.note != null) { state.note = null; applyNote(); } });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(applyNote, 120); });
  window.addEventListener('hashchange', route);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeNotes);
  window.addEventListener('load', placeNotes);
  route();
})();
</script>
</body>
</html>
