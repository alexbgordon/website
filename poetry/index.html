<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&family=Shippori+Mincho:wght@400;500&family=Noto+Serif+Ethiopic:wght@400&display=swap">
<style>
/* Layout: one sheet of paper on a desk. The poem keeps its own column and a right-hand margin carries
   the notes, each level with its word. Translation splits the sheet in half (mirrored for Hebrew). */
:root{
  --desk:#E7E0CF; --sheet:#FBF8F1; --ink:#211C17; --ink2:#4F463C; --muted:#74695C; --faint:#B5A892;
  --rule:#E2D8C6; --muted-desk:#665C50; --red:#A3241A; --wash:#F0D8CE; --shadow:rgba(60,40,20,.38);
  --serif:'EB Garamond','Shippori Mincho','Noto Serif Ethiopic',Georgia,'Times New Roman',serif;
  --hebrew:'Frank Ruhl Libre','EB Garamond','Times New Roman',serif;
  --mono:'Courier Prime','Courier New',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--muted-desk:#A99D8B;--desk:#15120E;--sheet:#221E19;--ink:#ECE4D4;--ink2:#CFC5B3;--muted:#A99D8B;--faint:#6A5F51;--rule:#3B342B;--red:#E5735E;--wash:#52302A;--shadow:rgba(0,0,0,.7);color-scheme:dark}
}
:root[data-theme="dark"]{--muted-desk:#A99D8B;--desk:#15120E;--sheet:#221E19;--ink:#ECE4D4;--ink2:#CFC5B3;--muted:#A99D8B;--faint:#6A5F51;--rule:#3B342B;--red:#E5735E;--wash:#52302A;--shadow:rgba(0,0,0,.7);color-scheme:dark}

body{background:var(--desk);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;
  margin:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}
button{font:inherit;color:inherit}

/* ---- top bar ---- */
.bar{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;align-items:flex-end;gap:0 22px;height:40px;margin:0 0 1.75rem;padding:0;border-bottom:1px solid var(--rule)}
.bar a,.bar .soon{flex:none}
.brand{font-size:16px;letter-spacing:.34em;text-decoration:none;padding-block:10px}
.nav{display:flex;flex-wrap:wrap;gap:0 26px;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.nav a{color:var(--muted-desk);text-decoration:none;display:inline-block;padding-block:10px;border-bottom:1px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--red);border-bottom-color:var(--red)}

/* ---- the sheet ---- */
.sheet{position:relative;background:var(--sheet);max-width:1080px;margin:0 auto;padding:72px 80px 60px 96px;box-sizing:border-box;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 44px -24px var(--shadow)}
.sheet.narrow{max-width:780px;padding:72px 88px 64px}
.sheet.wide{max-width:1380px}
.sheet + .sheet{margin-top:44px}
/* Inside the site-wide card (assets/chrome.css .ab-card) the sheets lose their own paper and keep their reading width. */
.ab-card .sheet{background:none;box-shadow:none;padding:0;margin-inline:auto;max-width:904px}
.ab-card .sheet.narrow{max-width:604px;padding:0}
.ab-card .sheet.wide{max-width:none;padding:0}
.ab-card .sheet + .sheet{margin-top:56px;padding-top:56px;border-top:1px solid var(--rule)}
.poetry-card{background:var(--sheet)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.label.red{color:var(--red)}
.sc{font-variant-caps:all-small-caps;letter-spacing:.14em}

/* ---- front page ---- */
.front{text-align:center}
.sitename{margin:0;font-weight:400;font-size:19px;letter-spacing:.38em;padding-left:.38em}
.redrule{width:36px;height:1px;background:var(--red);margin:22px auto 54px}
.epi{margin:0 auto;max-width:27em;text-align:left;font-style:italic;font-size:21px;line-height:1.6;text-wrap:pretty}
.attr{margin:20px auto 0;max-width:27em;text-align:right;font-size:17px;color:var(--muted)}
.epi-tr{margin:26px auto 0;max-width:30em;text-align:left;font-size:18px;line-height:1.6;color:var(--ink2);padding-top:20px;border-top:1px solid var(--rule)}
.tbtn{margin-top:26px;background:none;border:0;min-height:44px;padding:0 8px;font-size:18px;color:var(--ink);cursor:pointer}
.tbtn[aria-pressed="true"]{color:var(--red)}
.enter{display:inline-block;margin-top:34px;padding-block:10px;text-decoration:none;font-size:18px}
.enter:hover,.tbtn:hover{color:var(--red)}
.coll-open{margin:10px 0 30px;padding-bottom:22px;border-bottom:1px solid var(--rule);text-align:center}.coll-open .co-es{margin:0;font-size:19px;line-height:1.7;letter-spacing:.06em}.coll-open .co-en{margin:12px 0 0;font-size:15px;line-height:1.6;letter-spacing:.05em;font-style:italic;color:var(--ink2)}
.pref-lead{margin:6px 0 24px;font-size:25px;line-height:1.4;font-style:italic;text-wrap:balance}
.pref p{margin:0 0 14px;line-height:1.65}
.pref h2{margin:44px 0 18px;font-weight:500;font-size:19px;color:var(--red)}
.pref .lg{margin:0 0 14px;padding-left:1.4em;text-indent:-1.4em;font-size:18px;line-height:1.6}
.pref .lg b{font-weight:600}
.pref .front{margin-bottom:54px}.pref .front .attr{margin:20px auto 0}.pref p.front{margin:40px 0 0}
.pref .lg.coming{margin-top:22px;text-indent:0;padding-left:0;text-align:center;font-style:italic}
.biblio{list-style:none;margin:0 auto;padding:0;max-width:34em;font-size:18px;line-height:1.5}
.biblio li{padding:9px 0 9px 1.4em;text-indent:-1.4em;border-bottom:1px dotted var(--faint);text-wrap:pretty}
.biblio li:last-child{border-bottom:0;padding-top:18px;text-align:center;text-indent:0;padding-left:0}

/* ---- index ---- */
.ixh{margin:0 0 34px;text-align:center;font-weight:400;font-size:19px;letter-spacing:.38em;padding-left:.38em}
.ix{list-style:none;margin:0;padding:0}
.ix a{display:flex;align-items:baseline;gap:14px;padding-block:11px;text-decoration:none}
.ix .n{flex:none;width:2.4ch;font-family:var(--mono);font-size:14px;color:var(--red);font-variant-numeric:tabular-nums}
.ix .t{font-size:21px;letter-spacing:.16em;text-transform:uppercase;min-width:0}
.ix .t.he{font-family:var(--hebrew);font-size:24px;letter-spacing:0}
.ix .t.u{text-transform:none;letter-spacing:.01em;font-style:italic}
.ix .d{flex:1 1 24px;min-width:24px;border-bottom:1px dotted var(--faint);transform:translateY(-6px)}
.ix .c{flex:none;font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--red)}
.ix a:hover .t{color:var(--red)}
.ix .ixpref{border-bottom:1px solid var(--rule);margin-bottom:8px;padding-bottom:4px}
.ix .ixbib{border-top:1px solid var(--rule);margin-top:8px;padding-top:4px}
.ix .ixpref .t,.ix .ixbib .t{font-style:italic;text-transform:none;letter-spacing:.04em}
.prologue .label{text-align:center;margin:0 0 26px}
.prologue .coll-open{margin:0 auto;max-width:26em;border-bottom:0;padding-bottom:0}
.prologue .coll-open .co-es{font-size:21px;line-height:1.75}
.nav .soon{display:inline-block;padding-block:10px;border-bottom:1px solid transparent;color:var(--muted);font-style:italic;cursor:default;user-select:none}

/* ---- poem page ---- */
.pg{display:grid;grid-template-columns:minmax(0,1fr) 220px;column-gap:44px;row-gap:44px}
.ph{text-align:center;min-width:0}
.ptitle{margin:0;font-weight:400;font-size:32px;line-height:1.25;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;text-wrap:balance}
.ptitle[dir="rtl"]{font-family:var(--hebrew);font-size:46px;letter-spacing:0;padding-left:0;text-transform:none}
.ptitle.untitled{text-transform:none;letter-spacing:.01em;padding-left:0;font-style:italic}
.proma{margin:2px 0 0;font-style:italic;font-size:17px;color:var(--muted)}
.plangs{margin:12px 0 0;font-family:var(--mono);font-size:13px;letter-spacing:.1em;color:var(--red)}
.ctls{display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;margin-top:10px}
.ctl{background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl .box{color:var(--red)}
.ctl:hover:not(:disabled),.ctl[aria-pressed="true"]{color:var(--ink)}
.ctl:disabled{color:var(--faint);cursor:not-allowed}
.ctl:disabled .box{color:var(--faint)}
.about{border-left:1px solid var(--rule);padding-left:22px;font-size:15px;line-height:1.5;display:flex;flex-direction:column;min-width:0}
.about .tx{margin:0;font-style:italic;color:var(--ink2)}
.about .nl{margin-top:auto;padding-top:22px}

.rows{position:relative;min-width:0;font-size:20px;line-height:1.7}
.r{display:grid;grid-template-columns:minmax(0,1fr)}
.l{white-space:pre-wrap;padding-inline-start:calc(var(--pad,0em) + 1.4em);text-indent:-1.4em}
.l.epi{font-size:.85em;line-height:1.65;color:var(--ink2);margin-inline-start:2em}
.ro{font-style:italic;font-size:15px;line-height:1.35;color:var(--muted);margin:0 0 7px;padding-inline-start:1.4em}
.o[dir="rtl"]{font-family:var(--hebrew);font-size:1.3em;line-height:1.55}
.o[dir="rtl"] .ro{font-family:var(--serif);text-align:right;padding-inline:0 1.4em}
.tr{color:var(--ink);min-width:0}
.cols .o,.cols .tr{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:18px;line-height:1.5}
.cols .tt{display:block;font-family:var(--serif);font-size:20px;letter-spacing:.2em;color:var(--ink);margin-top:2px}
.cols .o[dir="rtl"] .tt{font-family:var(--hebrew);letter-spacing:0;font-size:24px}

.sec{margin:2.4em 0 1.1em;color:var(--red);text-align:center}
.rows > .sec:first-child{margin-top:.3em}
.sec .num{display:block;font-size:15px;letter-spacing:.24em;padding-left:.24em;margin-bottom:2px}
.sec .line{display:flex;align-items:center;gap:18px}
.sec .line::before,.sec .line::after{content:"";flex:1;height:1px;background:currentColor;opacity:.55}
.sec .t{font-size:18px;letter-spacing:.3em;padding-left:.3em;line-height:1.4}
.sec .t.big{font-size:26px;letter-spacing:.14em;padding-left:.14em}
.sec .t.he{font-family:var(--hebrew);font-size:26px;letter-spacing:0;padding-left:0}
.sec .sro{font-style:italic;font-size:15px;margin-top:2px}

/* note anchors: a red number at rest; the phrase lights up when clicked */
.a{background:none;border:0;padding:0 3px;margin:0 -3px;border-radius:3px;cursor:pointer;text-indent:0;line-height:inherit;white-space:pre-wrap;transition:background-color .15s}
.a sup{color:var(--red);font-family:var(--serif);font-size:.56em;margin-inline-start:1px;font-weight:500;line-height:0;font-style:normal}
.a:hover{background:color-mix(in srgb,var(--wash) 55%,transparent)}
.a[aria-pressed="true"]{background:var(--wash)}

.margin{position:relative;border-left:1px solid var(--rule)}
.mn{position:absolute;left:0;right:0;display:block;text-align:left;background:none;border:0;border-radius:4px;cursor:pointer;
  padding:3px 8px 5px 22px;font-size:15px;line-height:1.45;color:var(--muted);transition:top .2s ease,background-color .15s}
.mn:hover{color:var(--ink)}
.mn .n{color:var(--red);margin-right:8px}
.mn .lab.he{font-family:var(--hebrew);font-size:1.15em}
.mn .bd{display:none;margin-top:6px;font-style:italic;color:var(--ink2)}
.mn.on{left:10px;right:-14px;padding:12px 14px 14px;background:var(--wash);color:var(--ink)}
.mn.on .n{font-size:24px;line-height:1;vertical-align:-2px}
.mn.on .bd{display:block}
.mn{cursor:default}
.mn .mh{display:block;width:100%;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer}
.nsrc{display:block;margin-top:8px;font-style:normal;font-size:13px;line-height:1.5;color:var(--muted)}
.nsrc a{color:inherit}
.bd bdi[lang="he"],.more bdi[lang="he"],.more dt.he{font-family:var(--hebrew);font-style:normal}
.more{margin-top:56px;padding-top:12px;border-top:1px solid var(--rule);font-size:16px;line-height:1.55}
.more dl{margin:0}
.more dt{color:var(--red);margin-top:16px;line-height:1.4}
.more dd{margin:2px 0 0;font-style:italic;color:var(--ink2)}
.more .insp{margin:0 0 4px;color:var(--ink);font-size:17px;line-height:1.65;overflow-wrap:break-word}
.more .label.src{margin-top:30px;padding-top:14px;border-top:1px dotted var(--faint)}
.more dd{overflow-wrap:break-word}
.split .rs .sec{margin-block:2.4em 1.1em}
.rows > .rs:first-child .sec{margin-top:.3em}

/* translation: the sheet is cut in half */
.split .rows{font-size:18px}
.split .r{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:48px}
.split .r.solo{grid-template-columns:minmax(0,1fr)}
.split .rows.has-solo::before{display:none}
.split .rows.has-solo .r:not(.solo){position:relative}
.split .rows.has-solo .r:not(.solo)::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule)}
.split .rows::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule)}
.split .sec{position:relative;background:var(--sheet);padding-block:4px}

.pn{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;margin-top:64px;padding-top:12px;border-top:1px solid var(--rule)}
.pn a{text-decoration:none;font-style:italic;font-size:18px;padding-block:10px}
.pn a:hover{color:var(--red)}
.pn .mid{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* phone: the margin folds away and a clicked note rises from the bottom */
.card{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -14px 34px -14px var(--shadow);
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card .x{background:none;border:0;min-width:44px;min-height:44px;font-size:24px;color:var(--muted);cursor:pointer}
.card .lab{margin:2px 0 6px;font-size:19px}
.card .lab.he{font-family:var(--hebrew)}
.card .bd{margin:0;font-style:italic;color:var(--ink2);font-size:16px}
.card{max-height:70vh;overflow-y:auto}

/* poem-to-poem strip at the top of each poem (no looping: the first goes back to the Preface, the last on to the Index) */
.strip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin:0 0 40px;padding-bottom:10px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.strip a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;max-width:100%;overflow:hidden}
.strip a:hover{color:var(--red)}
.strip .sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;font-family:var(--serif);font-style:italic;font-size:16px;letter-spacing:0}
.strip .sn[lang="he"]{font-family:var(--hebrew);font-style:normal}
.strip .nx{justify-self:end}
.strip select{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:2px;min-height:44px;padding:0 10px;width:12em;max-width:46vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip-link{position:absolute;left:-999px;top:0;background:var(--red);color:#fff;padding:.5rem 1rem;z-index:30}
.skip-link:focus{left:.5rem;top:.5rem}
#app:focus{outline:none}
.ptitle:focus{outline:none}
.site-footer{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted-desk)}
.site-footer p{margin:0}
h1[tabindex="-1"]:focus{outline:none}
@media (max-width:900px){
  .bar{flex-wrap:wrap;height:auto;gap:0 18px}
  .ab-card .sheet,.ab-card .sheet.narrow,.ab-card .sheet.wide{padding:0}
  .strip{margin:0 0 28px;gap:8px}
  .strip .sn{display:none}
  .pg{grid-template-columns:minmax(0,1fr);row-gap:28px}
  .about{border-left:0;padding-left:0;text-align:center}
  .about .nl{display:none}
  .margin{display:none}
  .split .r{grid-template-columns:minmax(0,1fr)}
  .split .rows::before{display:none}
  .split .rows.has-solo .r:not(.solo)::after{display:none}
  .split .r .o{order:0}
  .split .r .tr{order:1;color:var(--muted);font-style:italic;margin-bottom:.5em}
  .split .rs .sec{margin-block:0}
  .split .rs .sec.o{margin-top:2.4em}
  .split .rs .sec.tr{margin-bottom:1.1em}
  .rows > .rs:first-child .sec.o{margin-top:.3em}
  .split .r.cols{display:none}
  .ix a{flex-wrap:wrap;row-gap:0}
  .ix .d{display:none}
  .ix .c{flex-basis:100%;padding-left:calc(2.4ch + 14px)}
  .rows{font-size:19px}
  .o[dir="rtl"]{font-size:1.12em}
  .ptitle[dir="rtl"]{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* =====================================================================
   ALEX BAHIA POETRY — content
   ---------------------------------------------------------------------
   One poem = one `src` string. How to write it:
     blank line            stanza break (two blank lines = a bigger break)
     leading tabs          indent, one tab stop each (like Word's tabs)
     spaces inside a line  kept exactly as typed
     # I. TITLE            section header ("I." becomes the small numeral)
     > text                epigraph line
     = text                romanization of the line just above
     ~en text              English translation of the line just above
                           (~fr and ~es work the same way)
     *italic*  **bold**    formatting
     [[phrase|3]]          note anchor: puts a red 3 after the phrase
   Notes: write them in `notes: {3: {en: '...'}}` (HTML allowed). An anchor
   with no note shows as plain text. `inspiration: {en: '...'}` = the
   Inspiration paragraph (HTML allowed), shown at the top of the Inspiration
   section; `more: [{label, en}]` = its sources and inspirations, listed
   under the paragraph (further notes without an anchor). `lang` = language code of the
   original (lines in another script are detected automatically).
   ===================================================================== */

const SITE = {
  title: 'Alex Bahia Poetry',
  lang: 'en'
};

const PIZARNIK = {

{ id: 'sakura', title: 'Sakura', langs: ['Spanish', 'Japanese'], codes: 'ES · JA', dir: 'ltr', script: true, lang: "es", trTitle: { en: "Cherry Blossom" },
  notes: {"1": {"en": "Saigyō's best-known poem wishes to die “beneath the blossoms, in spring, at the full moon of the second month” (negawaku wa hana no shita nite haru shinan). The dead sleeping under the cherries belongs to that tradition, though the poem doesn't quote him.<span class=\"nsrc\"><a href=\"https://www.carlsensei.com/classical/index.php/text/view/107\" target=\"_blank\" rel=\"noopener\">Saigyō, “negawaku wa”</a> · <a href=\"https://en.wikipedia.org/wiki/Saigy%C5%8D\" target=\"_blank\" rel=\"noopener\">Wikipedia: Saigyō</a></span>"}, "2": {"en": "Echoes Kajii Motojirō's short prose piece “Under the Cherry Trees” (Sakura no ki no shita ni wa, 1928), which opens: “There are dead bodies buried under the cherry trees!” Kajii is named in the poem itself (“las flores de Kajii”).<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Motojir%C5%8D_Kajii\" target=\"_blank\" rel=\"noopener\">Wikipedia: Motojirō Kajii</a> · <a href=\"https://www.newwriting.net/2017/01/under-the-cherry-trees/\" target=\"_blank\" rel=\"noopener\">Kajii, “Under the Cherry Trees” (English translation)</a></span>"}, "3": {"en": "“Daily bread” recalls the Lord's Prayer (“el pan nuestro de cada día”): the dead feed the trees.<span class=\"nsrc\"><a href=\"https://es.wikipedia.org/wiki/Padre_nuestro\" target=\"_blank\" rel=\"noopener\">Wikipedia (es): Padre nuestro</a></span>"}, "4": {"en": "満開 mankai, full bloom. Sakaguchi Ango's 1947 story “Sakura no mori no mankai no shita” (In the Forest, Under the Cherries in Full Bloom) has the same word in its title.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Ango_Sakaguchi\" target=\"_blank\" rel=\"noopener\">Wikipedia: Ango Sakaguchi</a></span>"}, "5": {"en": "Rosalía closes MOTOMAMI (2022) with “SAKURA”: “Flor de sakura… ser una popstar nunca te dura,” the cherry blossom's brief life as an image of impermanence. It inspired the poem's theme of ephemerality.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Motomami\" target=\"_blank\" rel=\"noopener\">Wikipedia: Motomami</a> · <a href=\"https://www.npr.org/2022/03/18/1087060987/rosalias-motomami-is-a-complex-treatise-on-fame-and-her-place-in-latin-pop\" target=\"_blank\" rel=\"noopener\">NPR on MOTOMAMI</a></span>"}, "6": {"en": "In Spanish siniestro means “left” as well as “sinister” (sinister is also Latin for left). The English “sinister eye” keeps both.<span class=\"nsrc\"><a href=\"https://dle.rae.es/siniestro\" target=\"_blank\" rel=\"noopener\">RAE: siniestro</a></span>"}, "7": {"en": "<span lang=\"ja\">花吹雪</span> hanafubuki, literally “flower blizzard”: the storm of cherry petals that blows down when the blossoms scatter.<span class=\"nsrc\"><a href=\"https://jisho.org/word/%E8%8A%B1%E5%90%B9%E9%9B%AA\" target=\"_blank\" rel=\"noopener\">Jisho</a></span>"}, "8": {"en": "<span lang=\"ja\">物語絵</span> monogatari-e, “story pictures”: Japanese paintings that illustrate narrative tales such as The Tale of Genji, often on handscrolls (emakimono).<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Emakimono\" target=\"_blank\" rel=\"noopener\">Wikipedia: Emakimono</a></span>"}, "9": {"en": "<span lang=\"ja\">愛</span> ai, love. When the poem gives love a colour, it is red or pink. Written in Latin letters inside a Spanish line, it reads almost like a name, and it sounds exactly like <span lang=\"ja\">哀</span> ai, sorrow, which sets up note 10.<span class=\"nsrc\"><a href=\"https://jisho.org/word/%E6%84%9B\" target=\"_blank\" rel=\"noopener\">Jisho</a></span>"}, "10": {"en": "“ai ga ai ni naru”: love (<span lang=\"ja\">愛</span>) becomes sorrow (<span lang=\"ja\">哀</span>). Both characters are read ai, so the line sounds like “ai becomes ai”; the change happens only in the writing, not in the sound. <span lang=\"ja\">哀</span> is also the aware of mono no aware, the ache of watching something pass.<span class=\"nsrc\"><a href=\"https://jisho.org/word/%E6%84%9B\" target=\"_blank\" rel=\"noopener\">Jisho</a> · <a href=\"https://jisho.org/search/%E5%93%80\" target=\"_blank\" rel=\"noopener\">Jisho</a> · <a href=\"https://en.wikipedia.org/wiki/Mono_no_aware\" target=\"_blank\" rel=\"noopener\">Wikipedia: Mono no aware</a></span>"}, "11": {"en": "Kajii describes the corpses “dripping with crystalline liquid” that the roots draw up into the blossoms; “sangre clara,” clear blood, answers that image.<span class=\"nsrc\"><a href=\"https://www.newwriting.net/2017/01/under-the-cherry-trees/\" target=\"_blank\" rel=\"noopener\">Kajii, “Under the Cherry Trees” (English translation)</a></span>"}, "12": {"en": "Amaru, the serpent or dragon deity of Andean myth (Quechua amaru, Aymara katari). The roots intertwined beneath the cherry trees call up the serpent, here a symbol of strength.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Amaru_(mythology)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Amaru (mythology)</a></span>"}, "13": {"en": "<span lang=\"ja\">葉桜</span> hazakura, the cherry tree in leaf once the blossoms are gone, which the closing stanza reaches: “solo queden hojas en las ramas.”<span class=\"nsrc\"><a href=\"https://jisho.org/word/%E8%91%89%E6%A1%9C\" target=\"_blank\" rel=\"noopener\">Jisho</a></span>"}, "14": {"en": "<span lang=\"ja\">木霊</span> kodama is an echo, and also the spirit that lives in a tree (folk belief says a mountain echo is the tree spirit answering). <span lang=\"ja\">子供</span> kodomo is a child. Call out someone's name, and what comes back: an echo, or a child? They are two different words that differ only in their vowels, a near-rhyme English can't keep.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Kodama_(spirit)\" target=\"_blank\" rel=\"noopener\">Wikipedia: Kodama (spirit)</a> · <a href=\"https://jisho.org/word/%E5%AD%90%E4%BE%9B\" target=\"_blank\" rel=\"noopener\">Jisho</a></span>"}},
  inspiration: {"en": "This poem began with something that happened to me. While I was trying to write about it, I was reading Japanese poetry, from Saigyō's cherry-blossom waka to Chiyo-ni's haiku, and Buddhist writing on mujō (<span lang=\"ja\">無常</span>), impermanence: the idea that nothing stays. I was also reading Kajii Motojirō's “Under the Cherry Trees,” with its bodies buried beneath the blossoms. What stayed with me was how short the sakura's life is, and how that shortness is the reason it is beautiful. Its brevity isn't something to resent; it's what makes you savor it more. To me the blossoms became a picture of a connection with someone that lasts only a little while, but that, looking back, was beautiful and changed me."},
  more: [{"label": "Chiyo-ni", "en": "The haiku poet of seasonal transience.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Fukuda_Chiyo-ni\" target=\"_blank\" rel=\"noopener\">Wikipedia: Fukuda Chiyo-ni</a></span>"}, {"label": "Kajii Motojirō, “Under the Cherry Trees” (1928)", "en": "The Japanese short prose piece of cherry blossoms and death.<span class=\"nsrc\"><a href=\"https://www.newwriting.net/2017/01/under-the-cherry-trees/\" target=\"_blank\" rel=\"noopener\">Kajii, “Under the Cherry Trees” (English translation)</a></span>"}, {"label": "Buddhist teaching on impermanence", "en": "The idea that nothing stays, which the poem is built around.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Impermanence\" target=\"_blank\" rel=\"noopener\">Wikipedia: Impermanence</a></span>"}],
  src: `
# 序
= jo
~en Prelude

Te pensé hasta
~en I thought of you even
en Japón, '24,
~en in Japan, in '24,
viendo sakuras
~en watching the cherry blossoms
cayendo desde el cielo.
~en falling out of the sky.

# 蕾
= tsubomi
~en Bud

En Japón dicen
~en In Japan they say
que los [[muertos duermen|1]]
~en the dead lie sleeping
[[bajo los sakuras|2]],
~en beneath the cherry trees,
cobrados por la tierra,
~en claimed by the earth,

y allí siguen, enroscados,
~en and there they stay, curled tight,
dándoles [[pan diario|3]].
~en giving them their daily bread.
De allí, enraizado,
~en From there, taking root,
vendría el rosa de sus flores.
~en would come the pink of their flowers.

# [[満開|4]]
= mankai
~en Full Bloom

[[Flor de sakura|5]],
~en Cherry blossom,
cae en tu ojo [[siniestro|6]].
~en falling into your sinister eye.
Dos deshojados,
~en Two of us, stripped of our petals,
tú y yo, juntos en el suelo.
~en you and I, together on the ground.

Bajo el [[hanafubuki|7]],
~en Under the blizzard of petals,
un [[monogatari-e|8]],
~en a painted tale:
del color del amor
~en the color of love
eran las flores de Kajii.
~en were Kajii's blossoms.

Rosas del [[Ai|9]] pasado
~en Roses of an Ai gone by,
raíz a rama— rojo mutado.
~en root to branch — a red transmuted.
[[愛 が 哀 に なる|10]]、
= ai ga ai ni naru,
~en Love turns into sorrow,
le corre [[sangre clara|11]], [[Amaru|12]].
~en and clear blood runs through it, Amaru.

# 散る
= chiru
~en Scattering

Que tuviéramos algo, no lo sabré.
~en Whether we had something, I will never know.
Es que yo por ti me enloquecí,
~en The truth is, I went mad for you;
te di todo: sangre, amor, aire
~en I gave you everything: blood, love, air,
pa' que pudieses florecer.
~en so that you could bloom.

Jamás supe y jamás sabré
~en I never knew and I will never know
lo que pasaba por tu mente.
~en what was going through your mind.
Me desangraba, y ahí quedabas,
~en I was bleeding out, and there you stayed,
clavado, de piedra, sin decir nada.
~en rooted, made of stone, saying nothing.

No cuidabas tus pasos:
~en You didn't watch your step,
entonces me dejaste caer,
~en and so you let me fall,
un romántico desesperado,
~en a hopeless romantic,
tal el último pétalo que cayó ayer.
~en like the last petal that fell yesterday.

# 落花
= rakka
~en Fallen Blossoms

Un día, a tu lado de nuevo,
~en One day, beside you again,
me desperté, y el alma también.
~en I woke up, and my soul did too.
Te miré otra vez, y la última fue.
~en I looked at you once more, and it was the last time.

# [[葉桜|13]]
= hazakura
~en Leaf-Cherry

Cada primavera vuelvo pensándote
~en Every spring I come back thinking of you,
cuando los cerezos, hasta en Nueva York,
~en when the cherry trees, even in New York,
se encienden de rosa; les grito tu nombre—
~en catch fire in pink; I shout your name at them —
名を呼べば、[[木霊か子供|14]]？
= na wo yobeba, kodama ka kodomo?
~en I call your name: an echo, or a child?

Y aunque oír tu nombre aún me dé escalofríos,
~en And though hearing your name still sends a shiver through me,
y aunque ahora solo queden hojas en las ramas
~en and though only leaves are left on the branches now
—verdes, tranquilas, pero ya sin flores—
~en — green, quiet, but with no flowers anymore —
atesoro que algo tan bonito pueda durar tan poco tiempo.
~en I treasure that something so beautiful can last so short a time.
` },

{ id: 'barcelona', title: 'Barcelona', langs: ['Catalan'], codes: 'CA', dir: 'ltr', script: false,
  trTitle: { en: 'Barcelona', fr: 'Barcelone', es: 'Barcelona' }, lang: "ca",
  notes: {"1": {"en": "The hill above Barcelona's harbour, with its castle, the palaces of the 1929 Exposition and the 1992 Olympic ring, looking out over the Mediterranean it “embraces”.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Montju%C3%AFc\" target=\"_blank\" rel=\"noopener\">Wikipedia: Montjuïc</a></span>"}, "2": {"en": "Both Sant Jordi and Gaudí. On Sant Jordi's Day (23 April), the feast of Catalonia's dragon-slaying patron saint, Barcelona fills with roses and books. Dragons also run through Gaudí's city, from the roof of Casa Batlló to the Park Güell salamander.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Saint_George%27s_Day_in_Catalonia\" target=\"_blank\" rel=\"noopener\">Wikipedia: Saint George&#x27;s Day in Catalonia</a> · <a href=\"https://en.wikipedia.org/wiki/Casa_Batll%C3%B3\" target=\"_blank\" rel=\"noopener\">Wikipedia: Casa Batlló</a></span>"}, "3": {"en": "Gold and red are the colours of the senyera, the Catalan flag of gold and red stripes.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Flag_of_Catalonia\" target=\"_blank\" rel=\"noopener\">Wikipedia: Flag of Catalonia</a></span>"}, "4": {"en": "Gaudí's mosaic salamander (often called el drac, the dragon) on the main stairway of Park Güell. “The park of the salamander” is Park Güell.<span class=\"nsrc\"><a href=\"https://en.wikipedia.org/wiki/Park_G%C3%BCell\" target=\"_blank\" rel=\"noopener\">Wikipedia: Park Güell</a></span>"}, "5": {"en": "Alexandre is the standard Catalan form of Alexander (and the French one too), so in Barcelona the name is an ordinary local name, not a foreign one.<span class=\"nsrc\"><a href=\"https://ca.wikipedia.org/wiki/Alexandre_(nom)\" target=\"_blank\" rel=\"noopener\">Viquipèdia: Alexandre (nom)</a></span>"}},
  inspiration: {"en": "Barcelona is my favorite city, and I wrote this poem in Catalan because I love her enough to want to say so in her own language. Dragons and roses are Sant Jordi, the day the whole city fills with roses and books, and they are Gaudí, whose dragons are on the roof of Casa Batlló and on the stairs of Park Güell. I wanted to be an architect when I was small, and the poem is mostly stone, sea and buildings. The last line is the one the whole poem walks toward: “on és normal dir-se Alexandre.” Alexandre is an ordinary Catalan name. In Barcelona my name isn't foreign, and for the length of that line, neither am I."},
