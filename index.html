<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
<link rel="preload" href="./assets/fonts/EBGaramond-normal-400-800-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="./assets/fonts/EBGaramond-italic-400-800-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="./assets/fonts/CourierPrime-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex Bahia</title>
  <meta name="description" content="Poems and invented languages by Alex Bahia.">
  <link rel="stylesheet" href="./assets/site.css">
  <style>
    /* Homepage in the Poetry landing style: centered sheet, spaced-capitals name over a short red rule, italic hook, big red section headings */
    .home { font-family: var(--serif); }
    .home-sheet { max-width: 604px; margin: 0 auto; padding: 8px 0 24px; text-align: center; }
    .home h1.sitename { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 19px; line-height: 1.6; letter-spacing: .38em; padding-left: .38em; text-transform: uppercase; color: var(--text); }
    .home .redrule { width: 36px; height: 1px; background: var(--accent); margin: 22px auto 40px; }
    .home-hook { margin: 0 0 56px; font-size: 25px; line-height: 1.4; font-style: italic; color: var(--text); text-wrap: balance; max-width: none; }
    .home-sec { margin: 0 0 48px; }
    .home-sec h2 { margin: 0 0 14px; font-family: var(--serif); font-weight: 500; font-size: 44px; line-height: 1.1; letter-spacing: .02em; }
    .home-sec h2 a { color: var(--accent); text-decoration: none; }
    .home-sec h2 a:hover, .home-sec h2 a:focus-visible { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
    .home-links { list-style: none; margin: 0; padding: 0; font-size: 21px; line-height: 1.5; }
    .home-links li { margin: 4px 0; }
    .home-links a { color: var(--text); text-decoration-color: var(--border); text-underline-offset: 4px; }
    .home-links a:hover { color: var(--accent); text-decoration-color: currentColor; }
    @media (max-width: 640px) { .home .redrule { margin-bottom: 30px; } .home-hook { font-size: 22px; margin-bottom: 40px; } .home-sec { margin-bottom: 38px; } .home-sec h2 { font-size: 36px; } .home-links { font-size: 19px; } }
    /* Pizarnik quote, as on the Poetry front page (same text, attribution and Translate toggle) */
    .home { --faint: #B5A892; }
    .home .sc { font-variant-caps: all-small-caps; letter-spacing: .14em; }
    .epi-wrap { margin: 0 auto 72px; padding: 0; }
    .epi { margin: 0 auto; max-width: 27em; text-align: left; font-style: italic; font-size: 21px; line-height: 1.6; text-wrap: pretty; color: var(--text); }
    .attr { margin: 20px auto 0; max-width: 27em; text-align: right; font-size: 17px; color: var(--muted); }
    .epi-tr { margin: 26px auto 0; max-width: 30em; text-align: left; font-size: 18px; line-height: 1.6; color: var(--text-2); padding-top: 20px; border-top: 1px solid var(--border); }
    .epi-bar { max-width: 27em; margin: 0 auto 6px; display: flex; justify-content: flex-end; }
    .ctl { background: none; border: 0; min-height: 44px; padding: 0 4px; cursor: pointer; font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .ctl .box { color: var(--accent); }
    .ctl:hover, .ctl[aria-pressed="true"] { color: var(--text); }
    .epi-wrap.on { width: min(1000px, calc(100vw - 160px)); margin-left: 50%; transform: translateX(-50%); }
    .epi-wrap.on .epi-bar { max-width: none; }
    .epi-wrap.on .epi-pair { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 56px; position: relative; }
    .epi-wrap.on .epi-pair::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--border); }
    .epi-wrap.on .epi, .epi-wrap.on .attr { max-width: none; margin-inline: 0; }
    .epi-wrap.on .epi { font-size: 20px; }
    .epi-wrap.on .epi-tr { margin: 0; padding-top: 0; border-top: 0; max-width: none; font-size: 19px; }
    @media (max-width: 900px) { .epi-wrap.on { width: auto; margin-left: 0; transform: none; } .epi-wrap.on .epi-pair { display: block; } .epi-wrap.on .epi-pair::before { display: none; } .epi-wrap.on .epi-tr { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); } }
    @media (max-width: 640px) { .epi { font-size: 19px; } .epi-wrap { margin-bottom: 56px; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
<!-- site-header:start -->
<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="./">Alex Bahia</a>
    <nav class="site-nav" aria-label="Main">

  <main id="main" class="wrap ab-card home">
    <div class="home-sheet">
      <h1 class="sitename">Alex Bahia</h1><div class="redrule"></div>
      <!-- SLOT home-hook: Alex's own hook line goes here (replace the text below). -->
      <p class="home-hook" data-slot="home-hook">Poems and invented languages.</p>
      <figure class="epi-wrap" id="epiWrap">
        <div class="epi-bar"><button type="button" class="ctl" id="epiBtn" aria-pressed="false" aria-controls="epiTr" aria-label="Translate the quote"><span class="box" aria-hidden="true">[&nbsp;]</span> Translate</button></div>
        <div class="epi-pair"><div class="epi-o"><blockquote class="epi" lang="es">Siento que los signos, las palabras, insinúan, hacen alusión. Este modo complejo de sentir el lenguaje me induce a creer que el lenguaje no puede expresar la realidad; que solamente podemos hablar de lo obvio. De allí mis deseos de hacer poemas terriblemente exactos a pesar de mi surrealismo innato y de trabajar con elementos de las sombras interiores. Es esto lo que ha caracterizado a mis poemas.</blockquote>
          <p class="attr sc">— Alejandra Pizarnik</p></div>
          <div class="epi-tr" id="epiTr" lang="en" hidden>I feel that signs, that words, insinuate, allude. This complex way of feeling language leads me to believe that language cannot express reality; that we can only speak of the obvious. Hence my desire to make poems that are terribly exact, despite my innate surrealism, and to work with elements of the inner shadows. This is what has characterized my poems.</div></div>
      </figure>
      <section class="home-sec" aria-labelledby="home-poetry">
        <h2 id="home-poetry"><a href="./poetry/">Poetry</a></h2>

      <section class="home-sec" aria-labelledby="home-languages">

      <section class="home-sec" aria-labelledby="home-gallery">
        <h2 id="home-gallery"><a href="./gallery/">Gallery</a></h2>
        <ul class="home-links">
          <li><a href="./gallery/#family-tree">Language family tree</a></li>

    <div class="wrap">
      <p>&copy; 2026 Alex Bahia</p>
    </div>
  </footer>
  <script>
  /* the quote's Translate toggle, as on the Poetry front page */
  (function () {
    var b = document.getElementById('epiBtn'); if (!b) { return; }
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('.box').innerHTML = '[' + (on ? 'x' : '&nbsp;') + ']';
      document.getElementById('epiTr').hidden = !on;
      document.getElementById('epiWrap').classList.toggle('on', on);
    });
  }());
  </script>
</body>
